تِكَ مِنْ عُقُوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لَا أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ","c":"","k":1,"s":"كان النبي ﷺ يقوله في سجوده. رواه مسلم."},{"t":"d","n":207,"x":"اللَّهُمَّ رَبَّ السَّمَاوَاتِ وَرَبَّ الْأَرْضِ وَرَبَّ الْعَرْشِ الْعَظِيمِ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ، فَالِقَ الْحَبِّ وَالنَّوَى، وَمُنْزِلَ التَّوْرَاةِ وَالْإِنْجِيلِ وَالْفُرْقَانِ، أَعُوذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللَّهُمَّ أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُونَكَ شَيْءٌ، اقْضِ عَنَّا الدَّيْنَ، وَأَغْنِنَا مِنَ الْفَقْرِ","c":"","k":1,"s":"كان النبي ﷺ يأمر به إذا أخذ أحدنا مضجعه. رواه مسلم."},{"t":"d","n":208,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ وَرَحْمَتِكَ، فَإِنَّهُ لَا يَمْلِكُهَا إِلَّا أَنْتَ","c":"","k":1,"s":"رواه الطبراني، وصححه الألباني."}]},{"id":"s36","kind":"chap","title":"الدعاء بأسماء الله الحسنى","part":"s32","items":[{"t":"a","x":"{{وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا}} [الأعراف: ١٨٠]"},{"t":"n","x":"الأسماء الواردة في هذا الدعاء هي التسعة والتسعون اسمًا التي جمعها الشيخ ابن عثيمين رحمه الله من الكتاب والسنة الصحيحة في «القواعد المثلى»، إذ لم يصحّ في تعيينها حديث، والسرد الوارد في رواية الترمذي مُدرَج ضعّفه أهل العلم. وصيغة الدعاء مؤلَّفة من جوامع الدعاء المأثور، يُدعى بها دعاءً مطلقًا لا يُتعبَّد بلفظها ولا بعددها، عملًا بقوله تعالى: {{فَادْعُوهُ بِهَا}}؛ فيُتوسَّل إلى الله في كل مطلوب بالاسم المناسب له."},{"t":"d","n":209,"x":"اللهم لك الحمد كله، ولك الملك كله، وبيدك الخير كله، وإليك يرجع الأمر كله، وصلِّ اللهم وسلّم على عبدك ورسولك محمد، وعلى آله وصحبه أجمعين. اللهم إني أسألك بأسمائك الحسنى وصفاتك العلا، يا الله الذي لا إله إلا هو، يا أحد يا صمد، الذي لم يلد ولم يولد ولم يكن له كفوًا أحد، أن تغفر لي ذنوبي، إنك أنت الغفور الرحيم. يا واحد يا إله، ثبّتني على توحيدك حتى ألقاك وأنت راضٍ عني. يا أول فليس قبلك شيء، ويا آخر فليس بعدك شيء، ويا ظاهر فليس فوقك شيء، ويا باطن فليس دونك شيء، اقضِ عني الدَّين وأغنني من الفقر. يا سبّوح يا قدّوس، طهّر قلبي من الشرك والرياء والكبر والحسد. يا ربّ، يا رحمن يا رحيم يا رؤوف، ارحمني رحمةً تغنيني بها عن رحمة من سواك. يا غفور يا غفّار، اغفر لي ما قدّمت وما أخّرت، وما أسررت وما أعلنت، وما أنت أعلم به مني. يا عفوّ اعفُ عني، ويا توّاب تُب عليّ إنك أنت التوّاب الرحيم، ويا حليم لا تعاجلني بالعقوبة. يا حقّ يا مبين، أرني الحق حقًّا وارزقني اتّباعه، وأرني الباطل باطلًا وارزقني اجتنابه. يا عليم يا عالم، علّمني ما ينفعني، وانفعني بما علّمتني، وزدني علمًا. يا حكيم، آتني الحكمة وفصل الخطاب. يا خبير يا بصير، أنت أعلم بحالي مني وأبصر بعيوبي، فأصلح لي شأني كله. يا رقيب يا شهيد، أسألك خشيتك في الغيب والشهادة. يا حافظ يا حفيظ، احفظني من بين يديّ ومن خلفي، وعن يميني وعن شمالي ومن فوقي، ويا عظيم أعوذ بعظمتك أن أُغتال من تحتي. يا مهيمن يا محيط، أحِطني برعايتك وكلاءتك. يا سلام سلّمني وسلّم مني، ويا مؤمن آمِن روعاتي. يا مولى يا وليّ يا نصير، تولّني فيمن تولّيت، وانصرني على من بغى عليّ. يا قويّ يا متين، قوّني على طاعتك، ولا تكلني إلى ضعفي. يا عزيز، أعزّني بطاعتك، ولا تذلّني بمعصيتك. يا قاهر يا قهّار، اكفني شرّ كل ذي شرّ أنت آخذ بناصيته. يا جبّار، اجبر كسري، وأصلح حالي. يا حسيب يا وكيل، أنت حسبي ونعم الوكيل، عليك توكّلت، وإليك فوّضت أمري. يا حَكَم، احكم بيني وبين من ظلمني بالحق، وأنت خير الحاكمين. يا خالق يا خلّاق يا بارئ يا مصوّر، كما أحسنت خَلقي فأحسن خُلُقي. يا جميل تحب الجمال، جمّل باطني وظاهري. يا رفيق تحب الرفق، ارزقني الرفق في أموري كلها. يا طيّب لا تقبل إلا طيبًا، طيّب كسبي وقلبي ولساني، وتقبّل مني. يا محسن تحب الإحسان، ارزقني الإحسان في عبادتك وإلى خلقك. يا كبير يا متكبّر، طهّر نفسي من الكِبر، وارزقني التواضع لك ولعبادك. يا ودود، حبّبني إليك وإلى عبادك الصالحين، وحبّبهم إليّ. يا رزّاق يا مُقيت، ارزقني رزقًا حلالًا طيبًا مباركًا فيه، يقوّيني على طاعتك. يا غنيّ، أغنني بحلالك عن حرامك، وبفضلك عمّن سواك. يا واسع، وسّع لي في رزقي، وبارك لي فيما أعطيتني. يا قابض يا باسط، ابسط عليّ من بركاتك ورحمتك وفضلك ورزقك. يا فتّاح، افتح لي أبواب رحمتك وأبواب فضلك. يا وهّاب، هب لي من لدنك رحمة، وهب لي من لدنك ذرية طيبة. يا معطي، أعطني ولا تحرمني، وزدني ولا تنقصني. يا جواد يا كريم يا أكرم، جُد عليّ بفضلك، وأكرمني ولا تُهنّي. يا برّ، أدخلني في برّك وسَعة رحمتك. يا حفيّ، كن بي حفيًّا كما كنت بخليلك إبراهيم حفيًّا. يا لطيف، الطف بي في أموري كلها. يا شافي، اشفني واشفِ مرضى المسلمين شفاءً لا يغادر سقمًا. يا قادر يا قدير يا مقتدر، اقدُر لي الخير حيث كان ثم أرضني به. يا سميع يا قريب يا مجيب، اسمع دعائي، وأجب دعوتي. يا حييّ يا كريم، لا تردّ يديّ إليك صِفرًا خائبتين. يا سيّد، أنا عبدك الفقير إليك، فلا تخيّب رجائي فيك. يا شاكر يا شكور، تقبّل قليل عملي، واجعله خالصًا لوجهك الكريم. يا وِتر تحب الوتر، اجعلني من أهل قيام الليل والوتر. يا مقدّم يا مؤخّر، قدّمني إلى كل خير، وأخّر عني كل شر. يا حيّ يا قيّوم، برحمتك أستغيث، أصلح لي شأني كله، ولا تكلني إلى نفسي طرفة عين. يا عليّ يا أعلى يا متعال، ارفع درجتي في الدنيا والآخرة. يا ملك يا مليك، اجعلني في مقعد صدقٍ عندك يوم القيامة. يا منّان، امنُن عليّ بالجنة، وأجِرني من النار. يا وارث، {{رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ}}. يا حميد يا مجيد، [[صلِّ على محمد وعلى آل محمد، كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد، وبارك على محمد وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد]]. والحمد لله رب العالمين.","c":"","k":1,"s":"دعاء جامع بأسماء الله الحسنى، مؤلَّف على طريقة التوسل بالاسم المناسب للمطلوب، وأكثر جمله من ألفاظ أدعية ثابتة في الصحيحين والسنن."}]},{"kind":"chap","title":"الدعاء الجامع","part":"s32","items":[{"t":"n","x":"دعاء طويل مؤلَّف من أدعية الكتاب والسنة الصحيحة: ثناء على الله، وصلاة على النبي ﷺ، ثم سؤال خيري الدنيا والآخرة، والدعاء للوالدين وللمسلمين. يُدعى به دعاءً مطلقًا، ويمكن نسخه كاملًا بزر النسخ."},{"t":"d","n":276,"x":"اللهم إني أسألك بأني أشهد أنك أنت الله، لا إله إلا أنت، الأحد الصمد، الذي لم يلد ولم يولد، ولم يكن له كفوًا أحد.\nسبحان الله وبحمده، عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته. سبحان الله العظيم وبحمده. سُبّوحٌ قُدّوسٌ، رب الملائكة والروح. سبحان ذي الجبروت والملكوت، والكبرياء والعظمة. {{سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ ۝ وَسَلَامٌ عَلَى الْمُرْسَلِينَ ۝ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ}}. سبحانك، ليس كمثلك شيء، وأنت السميع البصير، تنزّهت عن الشريك والنظير، والصاحبة والولد، وتقدّست أسماؤك، وجلّ ثناؤك، ولا إله غيرك.\nالله أكبر كبيرًا، والحمد لله كثيرًا، وسبحان الله بكرةً وأصيلًا. لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير. اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء. لا أحصي ثناءً عليك، أنت كما أثنيت على نفسك.\nسبحانك اللهم وبحمدك، وتبارك اسمك، وتعالى جدّك، ولا إله غيرك. اللهم لك الحمد، أنت نور السماوات والأرض ومن فيهن، ولك الحمد، أنت قيّم السماوات والأرض ومن فيهن، ولك الحمد، أنت الحق، ووعدك حق، ولقاؤك حق. ربنا ولك الحمد، حمدًا كثيرًا طيبًا مباركًا فيه، ملء السماوات وملء الأرض، وملء ما بينهما، وملء ما شئت من شيء بعد، أهل الثناء والمجد. لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم.\n[[اللهم صلِّ على محمدٍ وعلى آل محمد، كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد، اللهم بارك على محمدٍ وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد. اللهم صلِّ على محمدٍ عبدِك ورسولِك، كما صليت على إبراهيم، وبارك على محمدٍ وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم. اللهم صلِّ على محمدٍ وعلى أزواجه وذريته، كما صليت على آل إبراهيم، وبارك على محمدٍ وعلى أزواجه وذريته، كما باركت على آل إبراهيم، إنك حميد مجيد. اللهم صلِّ على محمدٍ النبيِّ الأمي وعلى آل محمد. اللهم صلِّ وسلِّم وبارك على محمدٍ عبدِك ورسولِك، صلاةً وسلامًا دائمين ما تعاقب الليل والنهار، وعدد ما ذكره الذاكرون، وعدد ما غفل عن ذكره الغافلون، وسلِّم تسليمًا كثيرًا.]]\nيا ودود، يا ذا العرش المجيد، يا فعّالًا لما يريد، يا حيّ يا قيّوم، يا ذا الجلال والإكرام، يا بديع السماوات والأرض، يا لطيفًا بعباده، يا أرحم الراحمين، ويا أكرم الأكرمين. اللهم إني أسألك بأن لك الحمد، لا إله إلا أنت وحدك لا شريك لك، المنّان، بديع السماوات والأرض، يا ذا الجلال والإكرام، يا حيّ يا قيّوم.\nإلهي، بك ألوذ، وبك أعوذ، وإليك ألجأ، ولا ملجأ ولا منجا منك إلا إليك. اللهم لك أسلمت، وبك آمنت، وعليك توكلت، وإليك أنبت، وبك خاصمت. يا حيّ يا قيّوم، برحمتك أستغيث.\nاللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك عليّ، وأبوء بذنبي، فاغفر لي، فإنه لا يغفر الذنوب إلا أنت.\nإلهي، وقفت ببابك فقيرًا وأنت الغني الكريم، ورفعت إليك حاجتي ذليلًا وأنت العزيز الرحيم، فلا تردّني خائبًا، {{وَلَمْ أَكُن بِدُعَائِكَ رَبِّ شَقِيًّا}}. يا من وسعت رحمته كل شيء، ارحم عبدًا لا يملك إلا الرجاء، ولا حيلة له إلا الدعاء. ربِّ إني مسّني الضر وأنت أرحم الراحمين. يا مقلّب القلوب، ثبّت قلبي على دينك.\nاللهم إني أسألك بأسمائك الحسنى وصفاتك العلا، وبإيماني بنبيك ومحبتي له، وببركة صلاتي وسلامي عليه، أن تنظر إلينا نظرة رضا ورحمة، لا تدع لنا ذنبًا إلا غفرته، ولا همًّا إلا فرّجته، ولا كربًا إلا نفّسته، ولا دَينًا إلا قضيته، ولا رزقًا ضيقًا إلا بسطته ووسّعته، يا أكرم الأكرمين.\nاللهم إنك عفوٌّ تحب العفو فاعفُ عني. اللهم إني أسألك العفو والعافية في الدنيا والآخرة. اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي. اللهم استر عوراتي، وآمن روعاتي. اللهم احفظني من بين يديّ ومن خلفي، وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أُغتال من تحتي.\nاللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي، واجعل الحياة زيادةً لي في كل خير، واجعل الموت راحةً لي من كل شر.\n{{لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ}}. اللهم رحمتك أرجو، فلا تكلني إلى نفسي طرفة عين، وأصلح لي شأني كله، لا إله إلا أنت. اللهم إني عبدك، ابن عبدك، ابن أمتك، ناصيتي بيدك، ماضٍ فيَّ حكمك، عدلٌ فيَّ قضاؤك، أسألك بكل اسم هو لك، سمّيت به نفسك، أو أنزلته في كتابك، أو علّمته أحدًا من خلقك، أو استأثرت به في علم الغيب عندك، أن تجعل القرآن ربيع قلبي، ونور صدري، وجلاء حزني، وذهاب همّي. اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والبخل والجبن، وضلَع الدَّين وغلبة الرجال.\n[[اللهم صلِّ وسلِّم على محمدٍ عبدِك ورسولِك]]، واجعل لي ببركة الصلاة عليه من كل همٍّ فرجًا، ومن كل ضيقٍ مخرجًا، ومن كل عسرٍ يسرًا.\nاللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمّن سواك. اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبَّلًا. اللهم أكثر مالي وولدي، وبارك لي فيما أعطيتني، واجعله عونًا لي على طاعتك. {{رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ}}. اللهم إن كان رزقي في السماء فأنزله، وإن كان في الأرض فأخرجه، وإن كان بعيدًا فقرّبه، وإن كان قليلًا فكثّره، وإن كان عسيرًا فيسّره، وبارك لي فيه.\nاللهم إني أسألك الهدى والتقى، والعفاف والغنى. اللهم اهدني وسدّدني. اللهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولّني فيمن تولّيت، وبارك لي فيما أعطيت، وقني شرّ ما قضيت. {{رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ}}.\nاللهم ارزقني حفظ كتابك، وتلاوته آناء الليل وأطراف النهار على الوجه الذي يرضيك، وفهم معانيه والعمل به. اللهم ذكّرني منه ما نسيت، وعلّمني منه ما جهلت، واجعله حجةً لي لا عليّ، واجعلني من أهل القرآن الذين هم أهلك وخاصتك. {{رَّبِّ زِدْنِي عِلْمًا}}.\nاللهم إني أعوذ بك من عذاب جهنم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن شرّ فتنة المسيح الدجال. نعوذ بالله من الفتن، ما ظهر منها وما بطن. اللهم إذا أردت بعبادك فتنةً فاقبضني إليك غير مفتون. اللهم جنّبنا الفواحش ما ظهر منها وما بطن، وثبّتنا بالقول الثابت في الحياة الدنيا وفي الآخرة، وأحسن خاتمتنا في الأمور كلها.\n[[اللهم صلِّ على محمدٍ وعلى آل محمد، كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد.]]\n{{رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا}}. {{رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ}}. {{رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي ۖ إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ}}. اللهم احفظ ذريتي من بين أيديهم ومن خلفهم، واجعلهم من الصالحين، وحبّب إليهم الإيمان وزيّنه في قلوبهم.\n{{رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا}}. {{رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ}}. اللهم اغفر لوالديّ وارحمهما، وعافهما واعفُ عنهما، وأكرم نُزُلهما، ووسّع مُدخلهما، واغسلهما بالماء والثلج والبَرَد، ونقّهما من الخطايا كما يُنقّى الثوب الأبيض من الدنس، وأبدلهما دارًا خيرًا من دارهما، وأدخلهما الجنة، وأعذهما من عذاب القبر ومن عذاب النار. اللهم اجعل قبريهما روضةً من رياض الجنة، واجمعني بهما في الفردوس الأعلى.\nاللهم اغفر لحيّنا وميّتنا، وشاهدنا وغائبنا، وصغيرنا وكبيرنا، وذكرنا وأنثانا. اللهم اغفر لموتى المسلمين أجمعين، ونوّر عليهم قبورهم، وارحم غربتهم. {{رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ}}.\nاللهم أصلح أحوال المسلمين في كل مكان، وألّف بين قلوبهم، وأصلح ذات بينهم، واجمع كلمتهم على الحق، واهدهم سُبُل السلام، ونجّهم من الظلمات إلى النور. اللهم احقن دماءهم، واكشف عنهم البلاء، وانصر المستضعفين منهم، ووفّق ولاة أمورهم لما تحب وترضى.\nاللهم اكتب لنا شفاعة نبيك ﷺ يوم العرض عليك، وأوردنا حوضه، واسقنا منه شربة هنيئة لا نظمأ بعدها أبدًا. اللهم إنا نسألك مرافقة نبيك في أعلى درجات الجنة، ولا تحرمنا رؤيته، واجعلنا من أقرب الناس منه مجلسًا يوم القيامة. اللهم كما آمنّا به ولم نره، فلا تحرمنا في الآخرة صحبته ورؤيته.\nاللهم إني أسألك الجنة وما قرّب إليها من قول أو عمل، وأعوذ بك من النار وما قرّب إليها من قول أو عمل. اللهم إني أسألك الفردوس الأعلى من غير حساب ولا سابقة عذاب، وأسألك لذة النظر إلى وجهك الكريم، والشوق إلى لقائك. اللهم أجرنا من النار، واجعلنا من عتقائك منها، {{رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ ۖ إِنَّ عَذَابَهَا كَانَ غَرَامًا}}.\n{{رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ}}.\n{{سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ ۝ وَسَلَامٌ عَلَى الْمُرْسَلِينَ}}. [[اللهم صلِّ وسلِّم وبارك على محمدٍ عبدِك ورسولِك، وعلى آله وأزواجه وذريته، كما صليت وباركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد، وسلِّم تسليمًا كثيرًا إلى يوم الدين]]، وآخر دعوانا أن الحمد لله رب العالمين.","c":"","k":1,"s":"مؤلَّف من أدعية القرآن الكريم والسنة الصحيحة"}],"id":"s37"},{"id":"s38","kind":"chap","title":"من جوامع دعاء النبي ﷺ","part":"s32","items":[{"t":"d","n":210,"x":"اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَعَافِنِي، وَارْزُقْنِي","c":"","k":1,"s":"«فإن هؤلاء تجمع لك دنياك وآخرتك». رواه مسلم."},{"t":"d","n":211,"x":"اللَّهُمَّ أَصْلِحْ لِي دِينِيَ الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":212,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى، وَالتُّقَى، وَالْعَفَافَ، وَالْغِنَى","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":213,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهِ، عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، وَأَعُوذُ بِكَ مِنَ الشَّرِّ كُلِّهِ، عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ عَبْدُكَ وَنَبِيُّكَ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا عَاذَ بِهِ عَبْدُكَ وَنَبِيُّكَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَعُوذُ بِكَ مِنَ النَّارِ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَسْأَلُكَ أَنْ تَجْعَلَ كُلَّ قَضَاءٍ قَضَيْتَهُ لِي خَيْرًا","c":"","k":1,"s":"علّمه النبي ﷺ عائشة رضي الله عنها. رواه ابن ماجه، وصححه الألباني."},{"t":"d","n":214,"x":"اللَّهُمَّ بِعِلْمِكَ الْغَيْبَ، وَقُدْرَتِكَ عَلَى الْخَلْقِ، أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْرًا لِي، وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْرًا لِي، اللَّهُمَّ وَأَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ، وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ، وَأَسْأَلُكَ الْقَصْدَ فِي الْفَقْرِ وَالْغِنَى، وَأَسْأَلُكَ نَعِيمًا لَا يَنْفَدُ، وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لَا تَنْقَطِعُ، وَأَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ، وَأَسْأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ، وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقَائِكَ، فِي غَيْرِ ضَرَّاءَ مُضِرَّةٍ، وَلَا فِتْنَةٍ مُضِلَّةٍ، اللَّهُمَّ زَيِّنَّا بِزِينَةِ الْإِيمَانِ، وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ","c":"","k":1,"s":"رواه النسائي، وصححه الألباني."},{"t":"d","n":215,"x":"اللَّهُمَّ اقْسِمْ لَنَا مِنْ خَشْيَتِكَ مَا يَحُولُ بَيْنَنَا وَبَيْنَ مَعَاصِيكَ، وَمِنْ طَاعَتِكَ مَا تُبَلِّغُنَا بِهِ جَنَّتَكَ، وَمِنَ الْيَقِينِ مَا تُهَوِّنُ بِهِ عَلَيْنَا مُصِيبَاتِ الدُّنْيَا، وَمَتِّعْنَا بِأَسْمَاعِنَا وَأَبْصَارِنَا وَقُوَّتِنَا مَا أَحْيَيْتَنَا، وَاجْعَلْهُ الْوَارِثَ مِنَّا، وَاجْعَلْ ثَأْرَنَا عَلَى مَنْ ظَلَمَنَا، وَانْصُرْنَا عَلَى مَنْ عَادَانَا، وَلَا تَجْعَلْ مُصِيبَتَنَا فِي دِينِنَا، وَلَا تَجْعَلِ الدُّنْيَا أَكْبَرَ هَمِّنَا، وَلَا مَبْلَغَ عِلْمِنَا، وَلَا تُسَلِّطْ عَلَيْنَا مَنْ لَا يَرْحَمُنَا","c":"","k":1,"s":"كان النبي ﷺ قلّما يقوم من مجلس حتى يدعو به. رواه الترمذي، وحسّنه الألباني."},{"t":"d","n":216,"x":"اللَّهُمَّ احْفَظْنِي بِالْإِسْلَامِ قَائِمًا، وَاحْفَظْنِي بِالْإِسْلَامِ قَاعِدًا، وَاحْفَظْنِي بِالْإِسْلَامِ رَاقِدًا، وَلَا تُشْمِتْ بِي عَدُوًّا وَلَا حَاسِدًا، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ كُلِّ خَيْرٍ خَزَائِنُهُ بِيَدِكَ، وَأَعُوذُ بِكَ مِنْ كُلِّ شَرٍّ خَزَائِنُهُ بِيَدِكَ","c":"","k":1,"s":"رواه الحاكم، وحسّنه الألباني."},{"t":"d","n":217,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الْأَمْرِ، وَالْعَزِيمَةَ عَلَى الرُّشْدِ، وَأَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ، وَعَزَائِمَ مَغْفِرَتِكَ، وَأَسْأَلُكَ شُكْرَ نِعْمَتِكَ، وَحُسْنَ عِبَادَتِكَ، وَأَسْأَلُكَ قَلْبًا سَلِيمًا، وَلِسَانًا صَادِقًا، وَأَسْأَلُكَ مِنْ خَيْرِ مَا تَعْلَمُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا تَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا تَعْلَمُ، إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ","c":"","k":1,"s":"قال ﷺ لشداد بن أوس رضي الله عنه: «إذا رأيت الناس قد اكتنزوا الذهب والفضة فاكنز هؤلاء الكلمات». رواه الطبراني في الكبير، وصحح الألباني إسناده (الصحيحة ٣٢٢٨)، وفي طرقه عند الترمذي والنسائي ضعف."},{"t":"d","n":218,"x":"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ","c":"","k":1,"s":"علّمه النبي ﷺ عليًّا رضي الله عنه، وقال: «لو كان عليك مثل جبل صِيرٍ دَينًا أدّاه الله عنك». رواه الترمذي، وحسّنه الألباني."},{"t":"d","n":219,"x":"اللَّهُمَّ كَمَا أَحْسَنْتَ خَلْقِي فَأَحْسِنْ خُلُقِي","c":"","k":1,"s":"من حديث عائشة رضي الله عنها. رواه أحمد، وصححه الألباني (الإرواء ١/١١٥)."},{"t":"d","n":220,"x":"اللَّهُمَّ مَتِّعْنِي بِسَمْعِي وَبَصَرِي، وَاجْعَلْهُمَا الْوَارِثَ مِنِّي، وَانْصُرْنِي عَلَى مَنْ يَظْلِمُنِي، وَخُذْ مِنْهُ بِثَأْرِي","c":"","k":1,"s":"من حديث أبي هريرة رضي الله عنه. رواه الترمذي، وحسّنه الألباني، وصححه بمجموع طرقه (الصحيحة ٣١٧٠)."},{"t":"d","n":221,"x":"اللَّهُمَّ لَكَ الْحَمْدُ كُلُّهُ، اللَّهُمَّ لَا قَابِضَ لِمَا بَسَطْتَ، وَلَا بَاسِطَ لِمَا قَبَضْتَ، وَلَا هَادِيَ لِمَا أَضْلَلْتَ، وَلَا مُضِلَّ لِمَنْ هَدَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُقَرِّبَ لِمَا بَاعَدْتَ، وَلَا مُبَاعِدَ لِمَا قَرَّبْتَ، اللَّهُمَّ ابْسُطْ عَلَيْنَا مِنْ بَرَكَاتِكَ وَرَحْمَتِكَ وَفَضْلِكَ وَرِزْقِكَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ النَّعِيمَ الْمُقِيمَ الَّذِي لَا يَحُولُ وَلَا يَزُولُ، اللَّهُمَّ إِنِّي أَسْأَلُكَ النَّعِيمَ يَوْمَ الْعَيْلَةِ، وَالْأَمْنَ يَوْمَ الْخَوْفِ، اللَّهُمَّ إِنِّي عَائِذٌ بِكَ مِنْ شَرِّ مَا أَعْطَيْتَنَا وَشَرِّ مَا مَنَعْتَ، اللَّهُمَّ حَبِّبْ إِلَيْنَا الْإِيمَانَ وَزَيِّنْهُ فِي قُلُوبِنَا، وَكَرِّهْ إِلَيْنَا الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ، وَاجْعَلْنَا مِنَ الرَّاشِدِينَ، اللَّهُمَّ تَوَفَّنَا مُسْلِمِينَ، وَأَحْيِنَا مُسْلِمِينَ، وَأَلْحِقْنَا بِالصَّالِحِينَ، غَيْرَ خَزَايَا وَلَا مَفْتُونِينَ، اللَّهُمَّ قَاتِلِ الْكَفَرَةَ الَّذِينَ يُكَذِّبُونَ رُسُلَكَ، وَيَصُدُّونَ عَنْ سَبِيلِكَ، وَاجْعَلْ عَلَيْهِمْ رِجْزَكَ وَعَذَابَكَ، اللَّهُمَّ قَاتِلِ الْكَفَرَةَ الَّذِينَ أُوتُوا الْكِتَابَ، إِلَهَ الْحَقِّ","c":"","k":1,"s":"دعا به النبي ﷺ يوم أُحُد، من حديث رفاعة بن رافع الزُّرَقي رضي الله عنه. رواه أحمد والبخاري في الأدب المفرد والحاكم، وصححه الألباني (صحيح الأدب المفرد ٥٣٨)، واستنكره الذهبي."}]},{"id":"s39","kind":"chap","title":"في طلب المغفرة والهداية والثبات","part":"s32","items":[{"t":"d","n":222,"x":"اللَّهُمَّ اغْفِرْ لِي خَطِيئَتِي وَجَهْلِي، وَإِسْرَافِي فِي أَمْرِي، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي، اللَّهُمَّ اغْفِرْ لِي جِدِّي وَهَزْلِي، وَخَطَئِي وَعَمْدِي، وَكُلُّ ذَلِكَ عِنْدِي","c":"","k":1,"s":"متفق عليه."},{"t":"d","n":223,"x":"اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ، وَمَا أَسْرَفْتُ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي، أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، لَا إِلَهَ إِلَّا أَنْتَ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":224,"x":"اللَّهُمَّ طَهِّرْنِي مِنَ الذُّنُوبِ وَالْخَطَايَا، اللَّهُمَّ نَقِّنِي مِنْهَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ طَهِّرْنِي بِالثَّلْجِ وَالْبَرَدِ وَالْمَاءِ الْبَارِدِ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":225,"x":"يَا مُقَلِّبَ الْقُلُوبِ، ثَبِّتْ قَلْبِي عَلَى دِينِكَ","c":"","k":1,"s":"كان أكثر دعاء النبي ﷺ. رواه الترمذي، وصححه الألباني."},{"t":"d","n":226,"x":"اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ، صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":227,"x":"اللَّهُمَّ اهْدِنِي وَسَدِّدْنِي، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالسَّدَادَ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":228,"x":"اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا، وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":229,"x":"اللَّهُمَّ لَكَ أَسْلَمْتُ، وَبِكَ آمَنْتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خَاصَمْتُ، اللَّهُمَّ إِنِّي أَعُوذُ بِعِزَّتِكَ، لَا إِلَهَ إِلَّا أَنْتَ، أَنْ تُضِلَّنِي، أَنْتَ الْحَيُّ الَّذِي لَا يَمُوتُ، وَالْجِنُّ وَالْإِنْسُ يَمُوتُونَ","c":"","k":1,"s":"متفق عليه، واللفظ لمسلم."},{"t":"d","n":230,"x":"رَبِّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ، وَانْصُرْنِي وَلَا تَنْصُرْ عَلَيَّ، وَامْكُرْ لِي وَلَا تَمْكُرْ عَلَيَّ، وَاهْدِنِي وَيَسِّرِ الْهُدَى لِي، وَانْصُرْنِي عَلَى مَنْ بَغَى عَلَيَّ، رَبِّ اجْعَلْنِي لَكَ شَكَّارًا، لَكَ ذَكَّارًا، لَكَ رَهَّابًا، لَكَ مِطْوَاعًا، لَكَ مُخْبِتًا، إِلَيْكَ أَوَّاهًا مُنِيبًا، رَبِّ تَقَبَّلْ تَوْبَتِي، وَاغْسِلْ حَوْبَتِي، وَأَجِبْ دَعْوَتِي، وَثَبِّتْ حُجَّتِي، وَسَدِّدْ لِسَانِي، وَاهْدِ قَلْبِي، وَاسْلُلْ سَخِيمَةَ صَدْرِي","c":"","k":1,"s":"رواه أبو داود والترمذي وابن ماجه، وصححه الألباني."},{"t":"d","n":231,"x":"اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي، وَعَلِّمْنِي مَا يَنْفَعُنِي، وَزِدْنِي عِلْمًا","c":"","k":1,"s":"رواه الترمذي وابن ماجه، وصححه الألباني."},{"t":"d","n":232,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ فِعْلَ الْخَيْرَاتِ، وَتَرْكَ الْمُنْكَرَاتِ، وَحُبَّ الْمَسَاكِينِ، وَأَنْ تَغْفِرَ لِي وَتَرْحَمَنِي، وَإِذَا أَرَدْتَ فِتْنَةَ قَوْمٍ فَتَوَفَّنِي غَيْرَ مَفْتُونٍ، وَأَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَحُبَّ عَمَلٍ يُقَرِّبُنِي إِلَى حُبِّكَ","c":"","k":1,"s":"رواه الترمذي، وصححه الألباني."},{"t":"d","n":233,"x":"اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، فَإِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، وَإِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ","c":"","k":1,"s":"علّمه النبي ﷺ الحسن بن علي يقوله في الوتر. رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":234,"x":"اللَّهُمَّ اغْفِرْ لِي، وَاهْدِنِي، وَارْزُقْنِي، وَعَافِنِي، أَعُوذُ بِاللَّهِ مِنْ ضِيقِ الْمَقَامِ يَوْمَ الْقِيَامَةِ","c":"","k":1,"s":"كان النبي ﷺ يقوله في قيام الليل. رواه أبو داود والنسائي، وصححه الألباني."},{"t":"d","n":235,"x":"اللَّهُمَّ حَاسِبْنِي حِسَابًا يَسِيرًا","c":"","k":1,"s":"كان النبي ﷺ يقوله في بعض صلاته. رواه أحمد، وجوّد الألباني إسناده."},{"t":"d","n":236,"x":"بِسْمِ اللَّهِ وَضَعْتُ جَنْبِي، اللَّهُمَّ اغْفِرْ لِي ذَنْبِي، وَأَخْسِئْ شَيْطَانِي، وَفُكَّ رِهَانِي، وَاجْعَلْنِي فِي النَّدِيِّ الْأَعْلَى","c":"","k":1,"s":"كان النبي ﷺ يقوله إذا أخذ مضجعه من الليل. رواه أبو داود، وصححه الألباني."},{"t":"d","n":237,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ إِيمَانًا لَا يَرْتَدُّ، وَنَعِيمًا لَا يَنْفَدُ، وَمُرَافَقَةَ مُحَمَّدٍ ﷺ فِي أَعْلَى جَنَّةِ الْخُلْدِ","c":"","k":1,"s":"من دعاء ابن مسعود رضي الله عنه، وأقرّه النبي ﷺ. رواه أحمد وابن حبان، وصححه الأرناؤوط لغيره."},{"t":"d","n":238,"x":"اللَّهُمَّ قِنِي شَرَّ نَفْسِي، وَاعْزِمْ لِي عَلَى أَرْشَدِ أَمْرِي، اللَّهُمَّ اغْفِرْ لِي مَا أَسْرَرْتُ، وَمَا أَعْلَنْتُ، وَمَا أَخْطَأْتُ، وَمَا عَمَدْتُ، وَمَا عَلِمْتُ، وَمَا جَهِلْتُ","c":"","k":1,"s":"علّمه النبي ﷺ حُصينًا والد عمران بن حصين رضي الله عنهما. رواه أحمد، وصححه ابن القيم (الوابل الصيب) وشعيب الأرناؤوط."}]},{"id":"s40","kind":"chap","title":"في الاستعاذة","part":"s32","items":[{"t":"d","n":239,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْهَرَمِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ","c":"","k":1,"s":"متفق عليه."},{"t":"d","n":240,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":241,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ، وَتَحَوُّلِ عَافِيَتِكَ، وَفُجَاءَةِ نِقْمَتِكَ، وَجَمِيعِ سَخَطِكَ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":242,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ، وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":243,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَهْدِ الْبَلَاءِ، وَدَرَكِ الشَّقَاءِ، وَسُوءِ الْقَضَاءِ، وَشَمَاتَةِ الْأَعْدَاءِ","c":"","k":1,"s":"كان النبي ﷺ يتعوّذ منها. متفق عليه."},{"t":"d","n":244,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ مُنْكَرَاتِ الْأَخْلَاقِ، وَالْأَعْمَالِ، وَالْأَهْوَاءِ","c":"","k":1,"s":"رواه الترمذي، وصححه الألباني."},{"t":"d","n":245,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْفَقْرِ وَالْقِلَّةِ وَالذِّلَّةِ، وَأَعُوذُ بِكَ مِنْ أَنْ أَظْلِمَ أَوْ أُظْلَمَ","c":"","k":1,"s":"رواه أبو داود والنسائي، وصححه الألباني."},{"t":"d","n":246,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُوعِ فَإِنَّهُ بِئْسَ الضَّجِيعُ، وَأَعُوذُ بِكَ مِنَ الْخِيَانَةِ فَإِنَّهَا بِئْسَتِ الْبِطَانَةُ","c":"","k":1,"s":"رواه أبو داود والنسائي، وحسّنه الألباني."},{"t":"d","n":247,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ، وَالْجُنُونِ، وَالْجُذَامِ، وَمِنْ سَيِّئِ الْأَسْقَامِ","c":"","k":1,"s":"رواه أبو داود والنسائي، وصححه الألباني."},{"t":"d","n":248,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَدْمِ، وَأَعُوذُ بِكَ مِنَ التَّرَدِّي، وَأَعُوذُ بِكَ مِنَ الْغَرَقِ وَالْحَرِيقِ وَالْهَرَمِ، وَأَعُوذُ بِكَ أَنْ يَتَخَبَّطَنِي الشَّيْطَانُ عِنْدَ الْمَوْتِ، وَأَعُوذُ بِكَ أَنْ أَمُوتَ فِي سَبِيلِكَ مُدْبِرًا، وَأَعُوذُ بِكَ أَنْ أَمُوتَ لَدِيغًا","c":"","k":1,"s":"رواه أبو داود والنسائي، وصححه الألباني."},{"t":"d","n":249,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكَسَلِ وَالْهَرَمِ، وَالْمَأْثَمِ وَالْمَغْرَمِ، وَمِنْ فِتْنَةِ الْقَبْرِ وَعَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ النَّارِ وَعَذَابِ النَّارِ، وَمِنْ شَرِّ فِتْنَةِ الْغِنَى، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْفَقْرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ، اللَّهُمَّ اغْسِلْ عَنِّي خَطَايَايَ بِمَاءِ الثَّلْجِ وَالْبَرَدِ، وَنَقِّ قَلْبِي مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ، وَبَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ","c":"","k":1,"s":"رواه البخاري."},{"t":"d","n":250,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ","c":"","k":1,"s":"كان سعد بن أبي وقاص رضي الله عنه يعلّمهن بنيه، ويقول: إن رسول الله ﷺ كان يتعوّذ بهن دبر الصلاة. رواه البخاري."},{"t":"d","n":251,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَالْهَرَمِ، وَالْقَسْوَةِ وَالْغَفْلَةِ، وَالْعَيْلَةِ وَالذِّلَّةِ وَالْمَسْكَنَةِ، وَأَعُوذُ بِكَ مِنَ الْفَقْرِ وَالْكُفْرِ، وَالْفُسُوقِ وَالشِّقَاقِ وَالنِّفَاقِ، وَالسُّمْعَةِ وَالرِّيَاءِ، وَأَعُوذُ بِكَ مِنَ الصَّمَمِ وَالْبَكَمِ، وَالْجُنُونِ وَالْجُذَامِ وَالْبَرَصِ، وَسَيِّئِ الْأَسْقَامِ","c":"","k":1,"s":"رواه الحاكم وابن حبان، وصححه الألباني."},{"t":"d","n":252,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ سَمْعِي، وَمِنْ شَرِّ بَصَرِي، وَمِنْ شَرِّ لِسَانِي، وَمِنْ شَرِّ قَلْبِي، وَمِنْ شَرِّ مَنِيِّي","c":"","k":1,"s":"علّمه النبي ﷺ شَكَل بن حُميد. رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":253,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَغَلَبَةِ الْعَدُوِّ، وَشَمَاتَةِ الْأَعْدَاءِ","c":"","k":1,"s":"رواه النسائي، وصححه الألباني."},{"t":"d","n":254,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَارِ السَّوْءِ فِي دَارِ الْمُقَامَةِ، فَإِنَّ جَارَ الْبَادِيَةِ يَتَحَوَّلُ","c":"","k":1,"s":"رواه النسائي والبخاري في الأدب المفرد، وحسّنه الألباني."},{"t":"d","n":255,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ يَوْمِ السُّوءِ، وَمِنْ لَيْلَةِ السُّوءِ، وَمِنْ سَاعَةِ السُّوءِ، وَمِنْ صَاحِبِ السُّوءِ، وَمِنْ جَارِ السُّوءِ فِي دَارِ الْمُقَامَةِ","c":"","k":1,"s":"من حديث عقبة بن عامر رضي الله عنه. رواه الطبراني، وحسّنه الألباني (صحيح الجامع ١٢٩٩)."}]},{"id":"s41","kind":"chap","title":"في سؤال الجنة والاستعاذة من النار","part":"s32","items":[{"t":"d","n":256,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ، وَأَعُوذُ بِكَ مِنَ النَّارِ","c":"ثلاث مرات","k":3,"s":"«من سأل الله الجنة ثلاث مرات قالت الجنة: اللهم أدخله الجنة، ومن استجار من النار ثلاث مرات قالت النار: اللهم أجره من النار». رواه الترمذي والنسائي، وصححه الألباني."},{"t":"d","n":257,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْفِرْدَوْسَ الْأَعْلَى مِنَ الْجَنَّةِ","c":"","k":1,"s":"قال ﷺ: «فإذا سألتم الله فاسألوه الفردوس، فإنه أوسط الجنة وأعلى الجنة». رواه البخاري."},{"t":"d","n":258,"x":"اللَّهُمَّ رَبَّ جِبْرَائِيلَ وَمِيكَائِيلَ، وَرَبَّ إِسْرَافِيلَ، أَعُوذُ بِكَ مِنْ حَرِّ النَّارِ، وَمِنْ عَذَابِ الْقَبْرِ","c":"","k":1,"s":"من حديث عائشة رضي الله عنها. رواه النسائي، وصححه الألباني."}]},{"id":"s42","kind":"part","title":"ملحق: أذكار وأدعية مشهورة في أسانيدها كلام","sub":"","part":null,"items":[]},{"id":"s43","kind":"chap","title":"أذكار للصباح والمساء في أسانيدها كلام","part":"s42","items":[{"t":"n","x":"هذه أذكار يوردها بعض أهل العلم في أذكار الصباح والمساء، ومنها ما في قائمة الأذكار المنسوبة إلى الشيخ محمد بن صالح العثيمين رحمه الله، وفي أسانيدها ضعف عند جماعة من المحدّثين كما بُيّن تحت كل ذكر. ومعانيها صحيحة، فمن دعا بها دعاءً مطلقًا فلا حرج، دون اعتقاد فضلٍ أو عددٍ مخصوص لم يثبت، والثابت فيما سبق يغني عنها."},{"t":"d","n":259,"x":"اللَّهُمَّ مَا أَصْبَحَ بِي (أَمْسَى بِي) مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","c":"مرة واحدة","k":1,"s":"رواه أبو داود والنسائي في الكبرى، وجوّد إسناده النووي، وضعّفه الألباني."},{"t":"d","n":260,"x":"اللَّهُمَّ إِنِّي أَصْبَحْتُ (أَمْسَيْتُ) أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ","c":"أربع مرات","k":4,"s":"رواه أبو داود، وضعّفه الألباني."},{"t":"d","n":261,"x":"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا","c":"ثلاث مرات","k":3,"s":"رواه أبو داود وابن ماجه، وضعّفه الألباني بهذا التقييد، وأصل الذكر ثابت في صحيح مسلم دون تقييد بالصباح والمساء."},{"t":"d","n":262,"x":"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","c":"سبع مرات","k":7,"s":"رواه أبو داود موقوفًا على أبي الدرداء رضي الله عنه، وضعّف الألباني رفعه. وأصله آية من القرآن [التوبة: ١٢٩]."},{"t":"d","n":263,"x":"اللَّهُمَّ إِنِّي أَصْبَحْتُ مِنْكَ فِي نِعْمَةٍ وَعَافِيَةٍ وَسِتْرٍ، فَأَتِمَّ عَلَيَّ نِعْمَتَكَ وَعَافِيَتَكَ وَسِتْرَكَ فِي الدُّنْيَا وَالْآخِرَةِ","c":"ثلاث مرات","k":3,"s":"رواه ابن السني، وفي إسناده راوٍ متروك، وحكم عليه الألباني بالوضع، فيُدعى بمعناه دعاءً مطلقًا دون نسبته إلى النبي ﷺ."},{"t":"d","n":264,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ","c":"","k":1,"s":"تقييده بالصباح والمساء رواه أبو داود وضعّفه الألباني، وأصل الدعاء ثابت في صحيح البخاري مطلقًا."},{"t":"d","n":265,"x":"قراءة أول سورة البقرة: {{الم ۝ ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ}} إلى قوله: {{وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ}}، وأول سورة غافر إلى قوله: {{إِلَيْهِ الْمَصِيرُ}}، وآخر سورة الحشر من قوله: {{هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ}} إلى آخرها","c":"","k":1,"s":"وردت فيها آثار وأحاديث عند الدارمي والترمذي، وفي أسانيدها ضعف."},{"t":"d","n":266,"x":"حَسْبُنَا اللَّهُ وَكَفَى، سَمِعَ اللَّهُ لِمَنْ دَعَا، لَيْسَ وَرَاءَ اللَّهِ مَرْمًى","c":"","k":1,"s":"لم أقف له على إسناد مرفوع، ومعناه صحيح."},{"t":"d","n":267,"x":"الصلاة على النبي ﷺ عشر مرات في الصباح وعشرًا في المساء","c":"","k":1,"s":"رواه الطبراني، وحسّنه الألباني أولًا ثم تراجع فضعّفه. والإكثار من الصلاة عليه ﷺ مشروع في كل وقت."},{"t":"d","n":268,"x":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","c":"مئة مرة في اليوم","k":100,"s":"هذا ثابت: «فإني أتوب في اليوم إليه مئة مرة» رواه مسلم، وأُورد هنا لأنه من قائمة ابن عثيمين."}]},{"id":"s44","kind":"chap","title":"أدعية في أسانيدها كلام","part":"s42","items":[{"t":"n","x":"أدعية تتداولها بعض كتب الأدعية، وفي أسانيدها ضعف بيّنه أهل العلم، فلم تُدرج في أبواب الكتاب، وذُكرت هنا للتنبيه. ومعانيها حسنة في الجملة، فمن دعا بشيء منها دعاءً مطلقًا دون نسبته إلى النبي ﷺ جزمًا فلا حرج، والثابت يغني عنها."},{"t":"d","n":269,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ، وَعَزَائِمَ مَغْفِرَتِكَ، وَالسَّلَامَةَ مِنْ كُلِّ إِثْمٍ، وَالْغَنِيمَةَ مِنْ كُلِّ بِرٍّ، وَالْفَوْزَ بِالْجَنَّةِ، وَالنَّجَاةَ مِنَ النَّارِ","c":"","k":1,"s":"رواه الحاكم وصححه، وضعّفه الألباني جدًّا (الضعيفة ٢٩٠٨). وأوله «موجبات رحمتك وعزائم مغفرتك» ثابت في دعاء شداد بن أوس في باب جوامع الدعاء."},{"t":"d","n":270,"x":"اللَّهُمَّ قَنِّعْنِي بِمَا رَزَقْتَنِي، وَبَارِكْ لِي فِيهِ، وَاخْلُفْ عَلَى كُلِّ غَائِبَةٍ لِي بِخَيْرٍ","c":"","k":1,"s":"رواه الحاكم وابن خزيمة، وضعّفه الألباني (الضعيفة ٦٠٤٢)."},{"t":"d","n":271,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِيشَةً نَقِيَّةً، وَمِيتَةً سَوِيَّةً، وَمَرَدًّا غَيْرَ مُخْزٍ وَلَا فَاضِحٍ","c":"","k":1,"s":"رواه الطبراني والحاكم، وضعّفه الألباني (الضعيفة ٢٩١٥)."},{"t":"d","n":272,"x":"اللَّهُمَّ أَلِّفْ بَيْنَ قُلُوبِنَا، وَأَصْلِحْ ذَاتَ بَيْنِنَا، وَاهْدِنَا سُبُلَ السَّلَامِ، وَنَجِّنَا مِنَ الظُّلُمَاتِ إِلَى النُّورِ...","c":"","k":1,"s":"رواه أبو داود، وضعّفه الألباني مرفوعًا، ورجّح الدارقطني أنه من دعاء ابن مسعود رضي الله عنه موقوفًا عليه."},{"t":"d","n":273,"x":"اللَّهُمَّ زِدْنَا وَلَا تَنْقُصْنَا، وَأَكْرِمْنَا وَلَا تُهِنَّا، وَأَعْطِنَا وَلَا تَحْرِمْنَا، وَآثِرْنَا وَلَا تُؤْثِرْ عَلَيْنَا، وَأَرْضِنَا وَارْضَ عَنَّا","c":"","k":1,"s":"رواه الترمذي، وضعّفه الألباني."},{"t":"d","n":274,"x":"اللَّهُمَّ ارْزُقْنِي حُبَّكَ، وَحُبَّ مَنْ يَنْفَعُنِي حُبُّهُ عِنْدَكَ...","c":"","k":1,"s":"رواه الترمذي، وضعّفه الألباني."},{"t":"d","n":275,"x":"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي، وَوَسِّعْ لِي فِي دَارِي، وَبَارِكْ لِي فِي رِزْقِي","c":"","k":1,"s":"رواه أحمد والترمذي، وضعّفه الألباني لانقطاعه (تمام المنة)."}]},{"id":"s45","kind":"sec","title":"الخاتمة","sub":"","part":null,"items":[{"t":"p","x":"الحمد لله الذي بنعمته تتم الصالحات، وصلى الله وسلم على نبينا محمد، وعلى آله وصحبه أجمعين."},{"t":"p","x":"فهذا ما تيسّر جمعه من الأذكار والأدعية الثابتة عن النبي ﷺ، وفيها غُنية لمن داوم عليها. أسأل الله أن يتقبّل هذا الجمع، وأن ينفع به، وأن يجعله غرسًا لجامعه ولوالديه ولقارئه وناشره في جنات النعيم. ولا تنسَ جامعه ووالديه من صالح دعائك."}]},{"id":"s46","kind":"sec","title":"المصادر والمراجع","sub":"","part":null,"items":[]},{"id":"s47","kind":"chap","title":"أولًا: القرآن الكريم","part":"s46","items":[{"t":"b","x":"المصحف الشريف، برواية حفص عن عاصم."}]},{"id":"s48","kind":"chap","title":"ثانيًا: كتب الحديث","part":"s46","items":[{"t":"b","x":"صحيح البخاري، للإمام محمد بن إسماعيل البخاري (ت ٢٥٦هـ)."},{"t":"b","x":"صحيح مسلم، للإمام مسلم بن الحجاج النيسابوري (ت ٢٦١هـ)."},{"t":"b","x":"سنن أبي داود، للإمام سليمان بن الأشعث السجستاني (ت ٢٧٥هـ)."},{"t":"b","x":"سنن الترمذي، للإمام محمد بن عيسى الترمذي (ت ٢٧٩هـ)."},{"t":"b","x":"سنن النسائي «المجتبى»، والسنن الكبرى، وعمل اليوم والليلة، للإمام أحمد بن شعيب النسائي (ت ٣٠٣هـ)."},{"t":"b","x":"سنن ابن ماجه، /* copy that also works when the page is opened as a local file (content:// or file://) */
function legacyCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;right:0;width:1px;height:1px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select(); try { ta.setSelectionRange(0, txt.length); } catch (e) {}
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}

/* freeze the page behind an open sheet, keeping its scroll position */
let _lockY = 0;
function pageLock(on){
  const r = document.documentElement, b = document.body;
  if (on === r.classList.contains('lock')) return;
  if (on) { _lockY = scrollY; r.classList.add('lock'); b.style.top = -_lockY + 'px'; }
  else { r.classList.remove('lock'); b.style.top = ''; scrollTo({ top: _lockY, behavior: 'instant' }); }
}
function manualCopy(txt){
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:40;overscroll-behavior:contain;background:rgba(10,8,4,.5);display:flex;align-items:flex-end;justify-content:center';
  box.innerHTML = '<div style="background:var(--card,var(--leaf));color:var(--ink);width:100%;max-width:40rem;border-radius:16px 16px 0 0;padding:1rem 16px calc(1rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.6rem">'
    + '<b style="font-size:.95rem">اضغط مطوّلًا على النص ثم اختر «نسخ»</b>'
    + '<textarea readonly style="width:100%;min-height:9rem;border:1px solid var(--line);border-radius:10px;padding:.6rem;font:inherit;font-size:1rem;line-height:1.8;background:var(--paper);color:var(--ink)"></textarea>'
    + '<button type="button" style="align-self:center;border:1px solid var(--line);border-radius:999px;padding:.4rem 1.2rem;background:none;color:inherit;font:inherit">إغلاق</button></div>';
  const ta = box.querySelector('textarea'); ta.value = txt;
  box.addEventListener('click', e => { if (e.target === box || e.target.tagName === 'BUTTON') { box.remove(); pageLock(false); } });
  document.body.appendChild(box); pageLock(true);
  ta.focus(); ta.select();
}
function copyText(txt, okMsg){
  const done = () => toast(okMsg);
  if (!(navigator.clipboard && window.isSecureContext)) { legacyCopy(txt) ? done() : manualCopy(txt); return; }
  navigator.clipboard.writeText(txt).then(done, () => { legacyCopy(txt) ? done() : manualCopy(txt); });
}

/* tasbih completion alert: vibration (Android) and/or a soft chime.

const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const CAN_VIB = !!navigator.vibrate && !IOS;

let _ac = null;
function chime(){
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    const t0 = _ac.currentTime + .01;
    [[1318.5, 0, .9], [1975.5, .12, .7]].forEach(([f, d, len]) => {
      const o = _ac.createOscillator(), g = _ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(.35, t0 + d + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + len);
      o.connect(g).connect(_ac.destination); o.start(t0 + d); o.stop(t0 + d + len + .05);
    });
  } catch (e) {}
}

/* prayer times — astronomical calculation on the device (no network) */
const PT = (() => {
  const R = Math.PI / 180;
  const sn = x => Math.sin(x * R), cs = x => Math.cos(x * R), tn = x => Math.tan(x * R);
  const as = x => Math.asin(x) / R, ac = x => Math.acos(x) / R, at2 = (y, x) => Math.atan2(y, x) / R;
  const fx = (a, b) => { a -= b * Math.floor(a / b); return a < 0 ? a + b : a; };
  const jul = (y, m, d) => { if (m <= 2) { y--; m += 12; } const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; };
  function sun(jd){
    const D = jd - 2451545, g = fx(357.529 + .98560028 * D, 360), q = fx(280.459 + .98564736 * D, 360);
    const L = fx(q + 1.915 * sn(g) + .02 * sn(2 * g), 360), e = 23.439 - .00000036 * D;
    const ra = fx(at2(cs(e) * sn(L), cs(L)) / 15, 24);
    return { decl: as(sn(e) * sn(L)), eqt: q / 15 - ra };
  }
  const METHODS = {
    umm:   { n: 'أم القرى', f: 18.5, i: 90 },
    egypt: { n: 'الهيئة المصرية العامة للمساحة', f: 19.5, a: 17.5 },
    mwl:   { n: 'رابطة العالم الإسلامي', f: 18, a: 17 },
    kar:   { n: 'جامعة العلوم الإسلامية بكراتشي', f: 18, a: 18 },
    isna:  { n: 'أمريكا الشمالية', f: 15, a: 15 },
  };
  /* returns UTC Date objects for the civil date y-m-d at (lat,lng) */
  function day(y, m, d, lat, lng, mk, ramadan){
    const M = METHODS[mk] || METHODS.umm, jd = jul(y, m, d) - lng / 360;
    const noonAt = t => fx(12 - sun(jd + t / 24).eqt, 24);
    const angT = (ang, t, before) => {
      const { decl } = sun(jd + t / 24), n = noonAt(t);
      const v = ac((-sn(ang) - sn(decl) * sn(lat)) / (cs(decl) * cs(lat))) / 15;
      return n + (before ? -v : v);
    };
    const asrT = t => {
      const { decl } = sun(jd + t / 24), ang = -at2(1, 1 + tn(Math.abs(lat - decl)));
      return angT(ang, t, false);
    };
    let T = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18, isha: 18 };
    for (let k = 0; k < 2; k++) T = {
      fajr: angT(M.f, T.fajr, true), sunrise: angT(.833, T.sunrise, true), dhuhr: noonAt(T.dhuhr),
      asr: asrT(T.asr), maghrib: angT(.833, T.maghrib, false), isha: M.i ? 0 : angT(M.a, T.isha, false) };
    if (M.i) T.isha = T.maghrib + (ramadan ? 120 : M.i) / 60;
    T.dhuhr += 1 / 60;                    /* a minute after the zenith */
    const base = Date.UTC(y, m - 1, d), out = {};
    for (const k in T) out[k] = isFinite(T[k]) ? new Date(base + Math.round((T[k] - lng / 15) * 60) * 60000) : null;
    return out;
  }
  return { day, METHODS };
})();

}

  const L = loc(), [y, m, d] = ymdIn(L.tz, new Date());

/* ---------- welcome: the star, the letter, then the seed of «غ» sprouts (≈2 s, once per session; tap to skip) ---------- */
function splash(){
  /* the welcome is already on screen (static markup, first paint); here we only end it */
  const d = document.getElementById('splash'); if (!d) return;
  const end = () => { if (!d.isConnected || d.classList.contains('out')) return; d.classList.add('out'); setTimeout(() => d.remove(), 400); };
  d.addEventListener('click', end);
  setTimeout(end, Math.max(500, 2100 - performance.now()));
}
splash();

/* app-like feel: block pinch and double-tap zoom (font size has its own control in settings) */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function(e){ if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
