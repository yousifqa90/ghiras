<head>
<meta charset="utf-8">

<title>غراس الذاكرين</title>
<style>@font-face{font-family:'Amiri';font-weight:400;font-display:swap;src:url(fonts/amiri-400.ttf) format('truetype')}@font-face{font-family:'Amiri';font-weight:700;font-display:swap;src:url(fonts/amiri-700.ttf) format('truetype')}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<style>
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* Layout: one reading column (max 40rem) under a sticky bar; book palette — paper, deep red, gold, green */
:root{
  --paper:#F5F3EC; --card:#FDFCF8; --ink:#1f1e1d; --muted:#6b675e; --line:#e4dfd3;
  --red:#AD4E2D; --gold:#856532; --green:#3f7a2a; --done:#eef3e6; --shadow:0 1px 0 rgba(60,50,30,.05),0 6px 18px -10px rgba(60,50,30,.22);
  --f-text:'Amiri','Traditional Arabic','Scheherazade New',serif;
  --f-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --fs:1.45rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1f1e1d; --card:#2a2927; --ink:#f0eee6; --muted:#a9a59a; --line:#3a3936;
  --red:#E08B6D; --gold:#d2b06a; --green:#9ccf6a; --done:#263020; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1f1e1d; --card:#2a2927; --ink:#f0eee6; --muted:#a9a59a; --line:#3a3936;
  --red:#E08B6D; --gold:#d2b06a; --green:#9ccf6a; --done:#263020; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark}

[hidden]{display:none!important}
html.lock{overflow:hidden;overscroll-behavior:none}
html.lock body{position:fixed;left:0;right:0;width:100%;overflow:hidden}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:40rem;margin:0 auto;padding:.55rem 16px;display:flex;align-items:center;gap:.5rem}
.bar h1{font-family:var(--f-text);font-weight:700;font-size:1.35rem;color:var(--red);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--ink)}
.ib svg{width:22px;height:22px}

main{max-width:40rem;margin:0 auto;padding-inline:16px;padding-block:1rem 5rem}

/* home */
.hero{text-align:center;padding-block:1.4rem 1rem}
.hero .logo{display:block;width:76px;height:76px;margin:0 auto .5rem;border-radius:20px;box-shadow:0 6px 16px -8px rgba(120,60,30,.5)}
.hero .t{font-family:var(--f-text);font-size:2.6rem;font-weight:700;color:var(--red);line-height:1.3;margin:0}
.hero .by{color:var(--muted);font-size:.88rem;margin-top:.15rem}
.orn{display:flex;align-items:center;gap:.6rem;justify-content:center;margin:.7rem auto;max-width:14rem;color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:currentColor;opacity:.7}
.orn i{width:9px;height:9px;transform:rotate(45deg);background:currentColor;display:block}
.hadith{font-family:var(--f-text);font-size:1.05rem;color:var(--green);max-width:30rem;margin:0 auto;line-height:1.9}

.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin-block:1.2rem 1.6rem}
.qt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.85rem .9rem;text-align:right;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.15rem;min-width:0}
.qt b{font-family:var(--f-text);font-size:1.2rem;color:var(--red)}
.qt span{font-size:.8rem;color:var(--muted)}
.qt .pg{height:3px;border-radius:2px;background:var(--line);margin-top:.45rem;overflow:hidden}
.qt .pg i{display:block;height:100%;background:var(--green);width:0}

.grp{margin-block:1.3rem .4rem;display:flex;flex-direction:column;align-items:flex-start;gap:.05rem}
.grp h2{margin:0;font-family:var(--f-text);font-size:1.25rem;color:var(--red)}
.grp small{color:var(--gold);font-size:.78rem;letter-spacing:.02em}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:.7rem;width:100%;padding:.75rem .95rem;border-top:1px solid var(--line);text-align:right}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.row .nm{flex:1;min-width:0;font-weight:500}
.row .ct{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.row .ck.on{background:var(--green);border-color:var(--green);color:var(--card)}
.row .ck svg{width:12px;height:12px}

/* chapter */
.ch-head{padding-block:.6rem .8rem}
.ch-head .crumb{font-size:14px;color:var(--gold)}
.ch-head h2{font-family:var(--f-text);font-size:1.9rem;color:var(--red);margin:.1rem 0 .4rem;line-height:1.35;text-wrap:balance}
.prog{display:flex;align-items:center;gap:.7rem;font-size:.82rem;color:var(--muted)}
.prog .bar2{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar2 i{display:block;height:100%;background:var(--green);transition:width .3s}
.prog button{color:var(--red);font-size:.82rem;padding:.2rem .4rem}

.stack{display:flex;flex-direction:column;gap:.75rem;margin-top:.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;transition:background .25s,opacity .25s}
.card .tap{display:block;width:100%;text-align:right;padding:1rem 1.05rem .7rem}
.card .top{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
.card .no{font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.card .when{font-size:13.5px;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 35%,transparent);border-radius:999px;padding:.05rem .55rem;background:color-mix(in srgb,var(--red) 6%,transparent)}
.card .tx{font-family:var(--f-text);font-size:var(--fs);line-height:2.05;color:var(--ink)}
.pb{display:block;height:.55em}
.card .ft{display:flex;align-items:center;gap:.15rem;padding:.5rem .7rem .6rem 1.05rem;border-top:1px dashed var(--line)}
.card .src{flex:1;min-width:0;font-size:14px;color:var(--muted);line-height:1.75}
.card .ft.wrap{flex-wrap:wrap;row-gap:.2rem}
.card .ft.wrap .src{flex:1 1 100%;padding-bottom:.15rem}
.card .ft.wrap .mini:first-of-type{margin-inline-start:auto}
.ctr{flex:none;min-width:56px;height:44px;margin-inline-start:.25rem;border-radius:999px;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums;background:var(--green);color:var(--card);font-size:1rem;padding-inline:.6rem}
.card.done{background:var(--done)}
.card.done .tx{opacity:.6}
.card.done .ctr{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.card.pop .ctr{animation:pop .22s ease}
@keyframes pop{50%{transform:scale(1.12)}}
.mini{width:44px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);flex:none}
.mini:active{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.mini svg{width:20px;height:20px}
.mini .lb{font-size:10.5px;line-height:1;color:var(--muted);white-space:nowrap}
.mini.on .lb{color:var(--gold)}
.hintbar{display:flex;align-items:center;gap:.5rem;background:color-mix(in srgb,var(--green) 9%,var(--card));border:1px solid color-mix(in srgb,var(--green) 30%,var(--line));border-radius:12px;padding:.55rem .8rem;font-size:14px;margin:.6rem 0 0;color:var(--ink);line-height:1.6}
.hintbar b{color:var(--green)}
.hintbar .x{margin-inline-start:auto;color:var(--muted);font-size:1.2rem;width:36px;height:36px;flex:none;display:grid;place-items:center}
.more-acts{display:flex;flex-direction:column;gap:.5rem}
.more-acts .sh-b{text-align:right}
.sharebox{margin:1.4rem 0 .4rem;text-align:center;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:1rem;box-shadow:var(--shadow)}
.sharebox p{margin:0 0 .6rem;color:var(--muted);font-size:.92rem}
.sharebox .chip{font-size:1rem;padding:.5rem 1.2rem;display:inline-flex;align-items:center;gap:.4rem}
.sharebox .chip svg{width:18px;height:18px}
.mini.on{color:var(--gold)}
.hidbox{margin-top:1.2rem;border:1px dashed var(--line);border-radius:14px;padding:.2rem .8rem;background:color-mix(in srgb,var(--card) 60%,transparent)}
.hidbox summary{cursor:pointer;color:var(--muted);font-size:.88rem;padding:.6rem 0;display:flex;align-items:center;gap:.4rem;list-style:none}
.hidbox summary::-webkit-details-marker{display:none}
.hidbox summary svg{width:16px;height:16px}
.hrow{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--line)}
.hrow .ht{flex:1;min-width:0;font-family:var(--f-text);font-size:1rem;line-height:1.8;color:var(--muted)}
.hrow .chip{flex:none}
.hall{display:flex;justify-content:center;padding:.5rem 0 .7rem;border-top:1px solid var(--line)}
.q{color:var(--green);font-weight:700}
.s{color:var(--red)}

.blk{font-family:var(--f-text);font-size:calc(var(--fs)*.82);line-height:2;padding-inline:.2rem}
.blk.a{text-align:center;color:var(--green);font-weight:700}
.blk.h{border-right:3px solid var(--gold);padding-right:.8rem}
.blk.h small{display:block;font-family:var(--f-ui);font-size:.78rem;color:var(--muted)}
.blk.n{font-family:var(--f-ui);font-size:.9rem;background:color-mix(in srgb,var(--green) 8%,transparent);border:1px dashed var(--line);border-radius:12px;padding:.7rem .9rem;color:var(--green);line-height:1.8}
.blk.b{padding-right:1.1rem;position:relative}
.blk.b::before{content:"";position:absolute;right:.1rem;top:1.05em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.blk.g{color:var(--red);text-align:left}

.pager{display:flex;gap:.6rem;margin-top:1.4rem}
.pager button{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;text-align:right}
.pager button small{display:block;color:var(--muted);font-size:.75rem}
.pager button b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager .nx{text-align:left}

/* search */
.sbox{display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.2rem .7rem;margin-top:.4rem}
.sbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1rem;color:var(--ink);padding:.6rem 0;outline:none}
.hint{color:var(--muted);font-size:.85rem;text-align:center;padding:2rem 0}
.res .in{font-size:.75rem;color:var(--gold);margin-bottom:.1rem}

/* tasbih */
.alerts{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;justify-content:center;font-size:.85rem;color:var(--muted)}
.alert-note{margin:-.5rem 0 0;font-size:.75rem;color:var(--muted);text-align:center}
.bead.fin{animation:fin .7s ease-out}
@keyframes fin{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.tsb{display:flex;flex-direction:column;align-items:center;gap:1rem;padding-top:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.35rem .85rem;font-size:.88rem}
.chip.on{background:var(--red);border-color:var(--red);color:var(--card)}
.qt.wide{grid-column:1/-1}
.qt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.quick.arr .qt[data-pid]{touch-action:none;cursor:grab;position:relative;animation:wig .28s ease-in-out infinite alternate}
.quick.arr .qt:not([data-pid]){opacity:.4}
.qt.ph{opacity:.25}
.qt.ghost{position:fixed;z-index:60;pointer-events:none;margin:0;box-shadow:0 14px 34px rgba(0,0,0,.28);transform:scale(1.04);cursor:grabbing}
.qt .rm{position:absolute;top:-.5rem;left:-.5rem;width:1.75rem;height:1.75rem;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:1.1rem;line-height:1;border:2px solid var(--paper);padding:0}
.pinbar .done{background:var(--green);color:#fff;font-weight:700}
.pinbar .done:hover{background:var(--green)}
.arrhint{display:block;text-align:center;color:var(--muted);font-size:.82rem;margin:-1rem 0 .6rem}
@keyframes wig{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
@media (prefers-reduced-motion: reduce){.quick.arr .qt[data-pid]{animation:none;outline:2px dashed var(--line);outline-offset:2px}}
.pinbar{display:flex;justify-content:center;margin:-.9rem 0 .4rem}
.pinlink{display:inline-flex;align-items:center;gap:.35rem;color:var(--green);font-size:.85rem;padding:.35rem .7rem;border-radius:999px}
.pinlink:hover{background:color-mix(in srgb,var(--green) 10%,transparent)}
.pinbtn{display:inline-flex;align-items:center;gap:.35rem;margin-top:.6rem;font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.25rem .75rem;background:var(--card)}
.chbtns{display:flex;flex-wrap:wrap;gap:.4rem}
.chbtns .pinbtn{margin-top:.6rem}
.pinbtn.on{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.pk-hint{margin:0;color:var(--muted);font-size:.85rem}
.pk{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow-y:auto;flex:1 1 auto;min-height:10rem;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pk>*{flex:none}
.pk-g{font-family:var(--f-text);color:var(--red);font-size:1.05rem;padding:.5rem .8rem .2rem;background:color-mix(in srgb,var(--gold) 8%,transparent)}
.pk-r{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-top:1px solid var(--line);cursor:pointer}
.pk-r input{width:1.15rem;height:1.15rem;accent-color:var(--green);flex:none}
.pk-r span{flex:1;min-width:0}
.pk-r small{color:var(--muted);font-variant-numeric:tabular-nums}
.pk-act{display:flex;gap:.5rem;justify-content:space-between}
.hero .ayah-h{font-family:var(--f-text);font-size:1.3rem;color:var(--green);font-weight:700;margin-top:.3rem}
.hero .ayah-h small{font-family:var(--f-ui);font-size:.75rem;color:var(--muted);font-weight:400}
.chip.add{border-style:dashed;color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.chip .pc{display:inline-block;min-width:1.4em;margin-inline-end:.35rem;padding:0 .3rem;border-radius:999px;font-size:.72rem;background:color-mix(in srgb,currentColor 16%,transparent)}
.chip .x{display:inline-grid;place-items:center;width:1.2rem;height:1.2rem;border-radius:50%;margin-inline-start:.35rem;font-size:.85rem;line-height:1;background:color-mix(in srgb,currentColor 18%,transparent)}
.addf{display:flex;flex-wrap:wrap;gap:.5rem;width:100%;max-width:26rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.7rem}
.addf input{flex:1 1 12rem;min-width:0;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;font:inherit;font-family:var(--f-text);font-size:1.1rem;background:var(--paper);color:var(--ink)}
.addf .btns{display:flex;gap:.4rem}
.addf button{border-radius:10px;padding:.5rem .9rem;font-size:.9rem}
.addf .ok{background:var(--green);color:var(--card)}
.addf .no{border:1px solid var(--line)}
.phrase{font-family:var(--f-text);font-size:1.7rem;color:var(--green);text-align:center;min-height:2.6em;line-height:1.5}
.phrase.long{font-size:1.2rem;line-height:1.9}
.tsb .chips .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addf .or{width:100%;font-size:.8rem;color:var(--muted);margin:.2rem 0 -.1rem}
.dlist{width:100%;max-height:min(55vh,26rem);overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.dlist h4{position:sticky;top:0;margin:0;padding:.4rem .7rem;font-family:var(--f-text);font-size:1rem;color:var(--red);background:color-mix(in srgb,var(--gold) 12%,var(--paper));backdrop-filter:blur(4px)}
.dlist button{display:block;width:100%;text-align:right;padding:.55rem .75rem;border-top:1px solid var(--line);font-family:var(--f-text);font-size:1.05rem;line-height:1.8;color:var(--ink)}
.dlist button:hover{background:color-mix(in srgb,var(--green) 8%,transparent)}
.dlist button[disabled]{color:var(--muted);opacity:.6}
.dlist button small{display:block;font-family:var(--f-ui,inherit);font-size:.72rem;color:var(--gold);line-height:1.4}
.bead{width:min(68vw,260px);aspect-ratio:1;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;display:grid;place-items:center;max-width:100%}
.bead svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.bead .start{font-size:1.35rem;color:var(--green);font-family:var(--f-text);line-height:1.3;text-align:center}
.tsb .chips.phr{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;padding:2px 2px 6px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(to left,#000 85%,transparent);mask-image:linear-gradient(to left,#000 85%,transparent)}
.tsb .chips.phr::-webkit-scrollbar{display:none}
.tsb .chips.phr .chip{flex:none;max-width:78vw;scroll-snap-align:start}
.bead .num{font-size:3.4rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.bead .of{font-size:.85rem;color:var(--muted);margin-top:.2rem;text-align:center}
.ver{text-align:center;font-size:.75rem;color:var(--muted)}
.reset{color:var(--red);font-size:.9rem;padding:.4rem .8rem}

/* settings sheet */
.sheet{position:fixed;inset:0;z-index:20;overscroll-behavior:contain;touch-action:pan-y;background:rgba(10,8,4,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{overscroll-behavior:contain;background:var(--card);width:100%;max-width:40rem;border-radius:18px 18px 0 0;padding:1.1rem 16px calc(1.2rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1rem;max-height:85vh;overflow:auto}
.sheet h3{margin:0;font-family:var(--f-text);font-size:1.3rem;color:var(--red)}
.opt{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.opt label{flex:1;min-width:8rem;font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:.45rem .8rem;font-size:.88rem}
.seg button.on{background:var(--red);color:var(--card)}
.prev{font-family:var(--f-text);font-size:var(--fs);line-height:2;background:var(--paper);border-radius:10px;padding:.5rem .8rem;color:var(--ink)}
.install{font-size:.85rem;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);padding-top:.8rem}
.danger{color:var(--red);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:10px;padding:.55rem .8rem;font-size:.88rem;align-self:flex-start}
.confirm{display:flex;gap:.5rem;align-items:center;font-size:.88rem;flex-wrap:wrap}

<script>
const DATA = [{"id":"s0","kind":"sec","title":"مقدمة الجامع","sub":"","part":null,"items":[{"t":"p","x":"الحمدُ لله ربِّ العالمين، والصلاةُ والسلامُ على نبيِّنا محمدٍ عبدِ الله ورسولِه، وعلى آله وصحبه أجمعين. أما بعد:"},{"t":"p","x":"فهذه أذكارٌ جمعتُها من كتاب الله تعالى ومن السنة الصحيحة، ورتّبتُها أبوابًا وفصولًا ليسهل على المسلم حفظُها والمداومةُ عليها في يومه وليلته وأحواله كلها، مع ذكر عدد الذكر إن ورد، وعزوِه إلى مصدره باختصار."},{"t":"p","x":"وسمّيتُه «غِراس الذاكرين»، أخذًا من حديث ابن مسعود رضي الله عنه، قال: قال رسول الله ﷺ:"},{"t":"h","x":"«لَقِيتُ إِبْرَاهِيمَ لَيْلَةَ أُسْرِيَ بِي، فَقَالَ: يَا مُحَمَّدُ، أَقْرِئْ أُمَّتَكَ مِنِّي السَّلَامَ، وَأَخْبِرْهُمْ أَنَّ الْجَنَّةَ طَيِّبَةُ التُّرْبَةِ، عَذْبَةُ الْمَاءِ، وَأَنَّهَا قِيعَانٌ، وَأَنَّ غِرَاسَهَا: سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ»","s":"رواه الترمذي، وحسّنه الألباني."},{"t":"p","x":"فكلُّ ذكرٍ يقوله العبد غرسٌ يُغرس له في الجنة، فأسأل الله أن ينفع به جامعَه وقارئَه وناشرَه، وأن يجعله خالصًا لوجهه الكريم."},{"t":"p","x":"وأسأل الله تعالى أن يجعل هذا العمل صدقةً جاريةً عن والديّ رحمهما الله، وأن يغفر لهما ويرحمهما، وأن يجعلهما في الفردوس الأعلى من الجنة، وأن يجمعنا بهما في مستقر رحمته مع النبيين والصديقين والشهداء والصالحين، وحسن أولئك رفيقًا."}]},{"id":"s1","kind":"sec","title":"منهج الكتاب","sub":"","part":null,"items":[{"t":"b","x":"اقتصرتُ في صلب الكتاب على ما صحّ أو حسُن من الأحاديث، معتمدًا في الحكم عليها على أحكام أهل العلم، ولا سيما الشيخ محمد ناصر الدين الألباني رحمه الله."},{"t":"b","x":"عزوتُ كل حديث إلى مصدره باختصار، مع ذكر حكمه إن كان في غير الصحيحين."},{"t":"b","x":"جعلتُ ما اشتهر على ألسنة الناس من الأذكار وفي أسانيده ضعف في ملحقٍ مستقل آخر الكتاب، مع بيان درجة كل رواية، تنبيهًا عليها لا اعتمادًا لها."},{"t":"b","x":"المراد بقولي «يُدعى بمعناه دعاءً مطلقًا»: أن يدعو المسلم بمعنى صحيح لا محذور فيه، دون أن ينسبه إلى النبي ﷺ، ودون أن يعتقد له فضلًا أو عددًا أو وقتًا مخصوصًا لم يثبت."},{"t":"b","x":"ما حُكم عليه بالوضع لا يُذكر منسوبًا إلى النبي ﷺ إلا مع بيان حاله، ولذلك نُبّه عليه في موضعه من الملحق."}]},{"id":"s2","kind":"sec","title":"فضل الذكر وآدابه","sub":"","part":null,"items":[{"t":"p","x":"أمر الله تعالى بذكره كثيرًا، وأثنى على الذاكرين، ووعدهم المغفرة والأجر العظيم، فقال سبحانه:"},{"t":"a","x":"{{فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ}} [البقرة: ١٥٢]"},{"t":"a","x":"{{يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا ۝ وَسَبِّحُوهُ بُكْرَةً وَأَصِيلًا}} [الأحزاب: ٤١-٤٢]"},{"t":"a","x":"{{وَالذَّاكِرِينَ اللَّهَ كَثِيرًا وَالذَّاكِرَاتِ أَعَدَّ اللَّهُ لَهُم مَّغْفِرَةً وَأَجْرًا عَظِيمًا}} [الأحزاب: ٣٥]"},{"t":"a","x":"{{الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ}} [الرعد: ٢٨]"},{"t":"p","x":"وقال رسول الله ﷺ:"},{"t":"h","x":"«مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لَا يَذْكُرُ رَبَّهُ، مَثَلُ الْحَيِّ وَالْمَيِّتِ»","s":"رواه البخاري."},{"t":"h","x":"«يَقُولُ اللَّهُ تَعَالَى: أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ذَكَرَنِي، فَإِنْ ذَكَرَنِي فِي نَفْسِهِ ذَكَرْتُهُ فِي نَفْسِي، وَإِنْ ذَكَرَنِي فِي مَلَإٍ ذَكَرْتُهُ فِي مَلَإٍ خَيْرٍ مِنْهُمْ»","s":"متفق عليه."},{"t":"h","x":"«أَلَا أُنَبِّئُكُمْ بِخَيْرِ أَعْمَالِكُمْ، وَأَزْكَاهَا عِنْدَ مَلِيكِكُمْ، وَأَرْفَعِهَا فِي دَرَجَاتِكُمْ، وَخَيْرٍ لَكُمْ مِنْ إِنْفَاقِ الذَّهَبِ وَالْوَرِقِ، وَخَيْرٍ لَكُمْ مِنْ أَنْ تَلْقَوْا عَدُوَّكُمْ فَتَضْرِبُوا أَعْنَاقَهُمْ وَيَضْرِبُوا أَعْنَاقَكُمْ؟» قَالُوا: بَلَى، قَالَ: «ذِكْرُ اللَّهِ تَعَالَى»","s":"رواه الترمذي وابن ماجه، وصححه الألباني."},{"t":"h","x":"«سَبَقَ الْمُفَرِّدُونَ»، قَالُوا: وَمَا الْمُفَرِّدُونَ يَا رَسُولَ اللَّهِ؟ قَالَ: «الذَّاكِرُونَ اللَّهَ كَثِيرًا وَالذَّاكِرَاتُ»","s":"رواه مسلم."},{"t":"h","x":"وقال ﷺ لرجلٍ سأله عن شيءٍ يتشبّث به: «لَا يَزَالُ لِسَانُكَ رَطْبًا مِنْ ذِكْرِ اللَّهِ»","s":"رواه الترمذي وابن ماجه، وصححه الألباني."}]},{"id":"s3","kind":"chap","title":"من آداب الذكر","part":"s2","items":[{"t":"b","x":"الإخلاص لله تعالى، واستحضار معنى ما يقوله الذاكر بقلبه، فخير الذكر ما تواطأ عليه القلب واللسان."},{"t":"b","x":"المحافظة على ما ثبت من القيود في الأذكار المقيّدة: فما ورد بلفظ أو عدد أو وقت أو حال معيّنة حوفظ عليه كما جاء. وأما الذكر المطلق فيُكثر منه المسلم بلا حدّ، دون أن ينسب إليه عددًا أو فضلًا خاصًّا بغير دليل."},{"t":"b","x":"الأصل في الذكر الإسرار وعدم التكلّف برفع الصوت، لقوله تعالى: {{وَاذْكُر رَّبَّكَ فِي نَفْسِكَ تَضَرُّعًا وَخِيفَةً وَدُونَ الْجَهْرِ مِنَ الْقَوْلِ}} [الأعراف: ٢٠٥]، مع مراعاة ما ثبت فيه الجهر من المواضع، كالتلبية، والأذان، والذكر عقب الصلوات المكتوبة."},{"t":"b","x":"عقد التسبيح بالأنامل، لقوله ﷺ: «وَاعْقِدْنَ بِالْأَنَامِلِ، فَإِنَّهُنَّ مَسْئُولَاتٌ مُسْتَنْطَقَاتٌ» (رواه الترمذي، وحسّنه الألباني)."},{"t":"b","x":"يُستحب أن يكون الذاكر على طهارة، مستقبل القبلة إن تيسّر، وليس ذلك شرطًا، فقد كان النبي ﷺ يذكر الله على كل أحيانه (رواه مسلم)."},{"t":"b","x":"المداومة على الذكر وإن قلّ، فأحب الأعمال إلى الله أدومها وإن قلّ (متفق عليه)."}]},{"id":"s4","kind":"part","title":"الباب الأول: الأذكار المطلقة","sub":"وهي الأذكار التي لا تتقيد بوقت ولا حال، يقولها المسلم متى شاء","part":null,"items":[]},{"id":"s5","kind":"chap","title":"الاستغفار والتوبة","part":"s4","items":[{"t":"d","n":1,"x":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","c":"","k":1,"s":"سيد الاستغفار. رواه البخاري."},{"t":"d","n":2,"x":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","c":"أكثر من سبعين مرة في اليوم","k":100,"s":"قال ﷺ: «والله إني لأستغفر الله وأتوب إليه في اليوم أكثر من سبعين مرة» رواه البخاري. وفي رواية: «فإني أتوب في اليوم إليه مئة مرة» رواه مسلم."},{"t":"d","n":3,"x":"رَبِّ اغْفِرْ لِي، وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ","c":"مئة مرة في المجلس","k":100,"s":"كان الصحابة يعدّونها للنبي ﷺ في المجلس الواحد. رواه أبو داود وابن ماجه، وصححه الألباني."},{"t":"d","n":4,"x":"أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيَّ الْقَيُّومَ وَأَتُوبُ إِلَيْهِ","c":"","k":1,"s":"غُفر له وإن كان فرّ من الزحف. رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":5,"x":"اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ","c":"","k":1,"s":"علّمه النبي ﷺ أبا بكر رضي الله عنه. متفق عليه."}]},{"id":"s6","kind":"chap","title":"التهليل","part":"s4","items":[{"t":"d","n":6,"x":"لَا إِلَهَ إِلَّا اللَّهُ","c":"","k":1,"s":"قال ﷺ: «أفضل الذكر: لا إله إلا الله» رواه الترمذي وابن ماجه، وحسّنه الألباني."},{"t":"d","n":7,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","c":"مئة مرة في اليوم","k":100,"s":"كانت له عدل عشر رقاب، وكُتبت له مئة حسنة، ومُحيت عنه مئة سيئة، وكانت له حرزًا من الشيطان يومه ذلك حتى يمسي. متفق عليه."},{"t":"d","n":8,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","c":"عشر مرات","k":10,"s":"كان كمن أعتق أربعة أنفس من ولد إسماعيل. متفق عليه."},{"t":"d","n":9,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، اللَّهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، سُبْحَانَ اللَّهِ رَبِّ الْعَالَمِينَ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَزِيزِ الْحَكِيمِ، اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَارْزُقْنِي","c":"","k":1,"s":"علّمه النبي ﷺ أعرابيًّا. رواه مسلم."},{"t":"d","n":10,"x":"لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ","c":"","k":1,"s":"كان النبي ﷺ يقولها عند الكرب. متفق عليه."},{"t":"d","n":11,"x":"{{لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ}}","c":"","k":1,"s":"دعوة ذي النون، لم يدعُ بها مسلم في شيء قط إلا استجاب الله له. رواه الترمذي، وصححه الألباني."},{"t":"d","n":12,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ، لَا إِلَهَ إِلَّا اللَّهُ لَا شَرِيكَ لَهُ، لَا إِلَهَ إِلَّا اللَّهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، لَا إِلَهَ إِلَّا اللَّهُ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","c":"","k":1,"s":"يصدّقه ربه في كل كلمة منها، ومن قالها في مرضه ثم مات لم تطعمه النار. رواه الترمذي وابن ماجه، وصححه الألباني."}]},{"id":"s7","kind":"chap","title":"التسبيح","part":"s4","items":[{"t":"d","n":13,"x":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","c":"مئة مرة في اليوم","k":100,"s":"حُطّت خطاياه وإن كانت مثل زبد البحر. متفق عليه."},{"t":"d","n":14,"x":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ","c":"","k":1,"s":"«كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن». متفق عليه."},{"t":"d","n":15,"x":"سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ","c":"","k":1,"s":"«تملآن (أو تملأ) ما بين السماوات والأرض». رواه مسلم."},{"t":"d","n":16,"x":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ","c":"ثلاث مرات","k":3,"s":"قالها النبي ﷺ لجويرية رضي الله عنها، وأخبر أنها تعدل ما قالته منذ الصباح. رواه مسلم."},{"t":"d","n":17,"x":"سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ","c":"","k":1,"s":"غُرست له نخلة في الجنة. رواه الترمذي، وصححه الألباني."},{"t":"d","n":18,"x":"سُبْحَانَ اللَّهِ","c":"مئة مرة","k":100,"s":"يُكتب له ألف حسنة، أو يُحط عنه ألف خطيئة. رواه مسلم."},{"t":"d","n":19,"x":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","c":"","k":1,"s":"كان النبي ﷺ يُكثر أن يقولها. رواه مسلم."},{"t":"d","n":20,"x":"سُبْحَانَ اللَّهِ عَدَدَ مَا خَلَقَ، سُبْحَانَ اللَّهِ مِلْءَ مَا خَلَقَ، سُبْحَانَ اللَّهِ عَدَدَ مَا فِي الْأَرْضِ وَالسَّمَاءِ، سُبْحَانَ اللَّهِ مِلْءَ مَا فِي الْأَرْضِ وَالسَّمَاءِ، سُبْحَانَ اللَّهِ عَدَدَ مَا أَحْصَى كِتَابُهُ، سُبْحَانَ اللَّهِ مِلْءَ مَا أَحْصَى كِتَابُهُ، سُبْحَانَ اللَّهِ عَدَدَ كُلِّ شَيْءٍ، سُبْحَانَ اللَّهِ مِلْءَ كُلِّ شَيْءٍ، الْحَمْدُ لِلَّهِ عَدَدَ مَا خَلَقَ، الْحَمْدُ لِلَّهِ مِلْءَ مَا خَلَقَ، الْحَمْدُ لِلَّهِ عَدَدَ مَا فِي الْأَرْضِ وَالسَّمَاءِ، الْحَمْدُ لِلَّهِ مِلْءَ مَا فِي الْأَرْضِ وَالسَّمَاءِ، الْحَمْدُ لِلَّهِ عَدَدَ مَا أَحْصَى كِتَابُهُ، الْحَمْدُ لِلَّهِ مِلْءَ مَا أَحْصَى كِتَابُهُ، الْحَمْدُ لِلَّهِ عَدَدَ كُلِّ شَيْءٍ، الْحَمْدُ لِلَّهِ مِلْءَ كُلِّ شَيْءٍ","c":"","k":1,"s":"قال ﷺ لأبي أمامة رضي الله عنه: «ألا أخبرك بأكثرَ وأفضلَ من ذكرك الليلَ مع النهار والنهارَ مع الليل؟». رواه أحمد والنسائي في الكبرى، وصححه الألباني (صحيح الترغيب ١٥٧٥)."},{"t":"n","x":"ومن صيغ التسبيح المقيّدة بمواضعها: «سبحانك اللهم وبحمدك، وتبارك اسمك...» في دعاء الاستفتاح، و«سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي» في الركوع والسجود، وتأتيان في فصل أذكار الصلاة، و«سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك» بعد الوضوء وفي كفارة المجلس."}]},{"id":"s8","kind":"chap","title":"التحميد","part":"s4","items":[{"t":"d","n":21,"x":"الْحَمْدُ لِلَّهِ","c":"","k":1,"s":"قال ﷺ: «والحمد لله تملأ الميزان» رواه مسلم. وقال: «وأفضل الدعاء: الحمد لله» رواه الترمذي، وحسّنه الألباني."},{"t":"d","n":22,"x":"الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ","c":"","k":1,"s":"رأى النبي ﷺ بضعةً وثلاثين ملكًا يبتدرونها أيهم يكتبها أول. رواه البخاري."}]},{"id":"s9","kind":"chap","title":"التكبير","part":"s4","items":[{"t":"a","x":"{{وَقُلِ الْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُن لَّهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُن لَّهُ وَلِيٌّ مِّنَ الذُّلِّ ۖ وَكَبِّرْهُ تَكْبِيرًا}} [الإسراء: ١١١]"},{"t":"d","n":23,"x":"اللَّهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا","c":"","k":1,"s":"قال ﷺ: «عجبتُ لها، فُتحت لها أبواب السماء». رواه مسلم."}]},{"id":"s10","kind":"chap","title":"الباقيات الصالحات والحوقلة","part":"s4","items":[{"t":"a","x":"{{وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا}} [الكهف: ٤٦]"},{"t":"d","n":24,"x":"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ","c":"","k":1,"s":"«أحبُّ الكلام إلى الله أربع... لا يضرك بأيهن بدأت» رواه مسلم. وقال ﷺ: «لأن أقولها أحبُّ إليَّ مما طلعت عليه الشمس» رواه مسلم. وهي غراس الجنة كما في حديث ابن مسعود في المقدمة."},{"t":"d","n":25,"x":"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","c":"","k":1,"s":"علّمها النبي ﷺ رجلًا قال: إني لا أستطيع أن آخذ من القرآن شيئًا فعلّمني ما يجزئني. رواه أبو داود، وحسّنه الألباني."},{"t":"d","n":26,"x":"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","c":"","k":1,"s":"قال ﷺ لأبي موسى: «ألا أدلك على كنزٍ من كنوز الجنة؟ لا حول ولا قوة إلا بالله» متفق عليه."}]},{"id":"s11","kind":"chap","title":"الصلاة على النبي ﷺ","part":"s4","items":[{"t":"a","x":"{{إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا}} [الأحزاب: ٥٦]"},{"t":"h","x":"«مَنْ صَلَّى عَلَيَّ صَلَاةً، صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا»","s":"رواه مسلم."},{"t":"d","n":27,"x":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ","c":"","k":1,"s":"من حديث كعب بن عُجرة. متفق عليه."},{"t":"d","n":28,"x":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ، وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ","c":"","k":1,"s":"من حديث أبي سعيد الخدري. رواه البخاري."},{"t":"d","n":29,"x":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى أَزْوَاجِهِ وَذُرِّيَّتِهِ، كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ، وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى أَزْوَاجِهِ وَذُرِّيَّتِهِ، كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ","c":"","k":1,"s":"من حديث أبي حُميد الساعدي. متفق عليه."},{"t":"d","n":30,"x":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ، وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَآلِ إِبْرَاهِيمَ، وَبَارِكْ عَلَى مُحَمَّدٍ النَّبِيِّ الْأُمِّيِّ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَآلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ","c":"","k":1,"s":"من حديث أبي مسعود الأنصاري رضي الله عنه. رواه أحمد وأبو داود، وحسّنه الألباني."},{"t":"h","x":"«إِنَّ مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمَ الْجُمُعَةِ... فَأَكْثِرُوا عَلَيَّ مِنَ الصَّلَاةِ فِيهِ، فَإِنَّ صَلَاتَكُمْ مَعْرُوضَةٌ عَلَيَّ»","s":"رواه أبو داود والنسائي، وصححه الألباني."},{"t":"h","x":"«الْبَخِيلُ الَّذِي مَنْ ذُكِرْتُ عِنْدَهُ فَلَمْ يُصَلِّ عَلَيَّ»","s":"رواه الترمذي، وصححه الألباني."}]},{"id":"s12","kind":"part","title":"الباب الثاني: أذكار اليوم والليلة","sub":"مرتبةً على يوم المسلم، من استيقاظه إلى نومه","part":null,"items":[]},{"id":"s13","kind":"chap","title":"أذكار الاستيقاظ من النوم","part":"s12","items":[{"t":"d","n":31,"x":"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ","c":"","k":1,"s":"رواه البخاري."},{"t":"d","n":32,"x":"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لِي بِذِكْرِهِ","c":"","k":1,"s":"رواه الترمذي، وحسّنه الألباني."},{"t":"d","n":33,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، الْحَمْدُ لِلَّهِ، وَسُبْحَانَ اللَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، اللَّهُمَّ اغْفِرْ لِي","c":"","k":1,"s":"لمن استيقظ من الليل، فإن دعا استُجيب له، فإن توضأ وصلى قُبلت صلاته. رواه البخاري."},{"t":"n","x":"ويُستحب لمن قام من الليل أن يقرأ الآيات العشر من آخر سورة آل عمران: {{إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ}} إلى آخر السورة، كما فعل النبي ﷺ (متفق عليه)."}]},{"id":"s14","kind":"chap","title":"أذكار الخلاء والوضوء","part":"s12","items":[{"t":"d","n":34,"x":"بِسْمِ اللَّهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ","c":"عند دخول الخلاء","k":1,"s":"الاستعاذة متفق عليها، والتسمية رواها الترمذي، وصححها الألباني."},{"t":"d","n":35,"x":"غُفْرَانَكَ","c":"عند الخروج من الخلاء","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":36,"x":"بِسْمِ اللَّهِ","c":"قبل الوضوء","k":1,"s":"قال ﷺ: «لا وضوء لمن لم يذكر اسم الله عليه». رواه أبو داود وابن ماجه، وصححه الألباني."},{"t":"d","n":37,"x":"أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ","c":"بعد الوضوء","k":1,"s":"فُتحت له أبواب الجنة الثمانية يدخل من أيها شاء. رواه مسلم."},{"t":"d","n":38,"x":"اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ، وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ","c":"بعد الوضوء","k":1,"s":"رواه الترمذي، وصححه الألباني."},{"t":"d","n":39,"x":"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ","c":"بعد الوضوء","k":1,"s":"كُتب في رقٍّ ثم طُبع بطابع فلم يُكسر إلى يوم القيامة. رواه النسائي في عمل اليوم والليلة، وصححه الألباني."}]},{"id":"s15","kind":"chap","title":"أذكار المسجد","part":"s12","items":[{"t":"d","n":40,"x":"اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي بَصَرِي نُورًا، وَفِي سَمْعِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ يَسَارِي نُورًا، وَفَوْقِي نُورًا، وَتَحْتِي نُورًا، وَأَمَامِي نُورًا، وَخَلْفِي نُورًا، وَاجْعَلْ لِي نُورًا","c":"عند الخروج إلى الصلاة","k":1,"s":"متفق عليه."},{"t":"d","n":41,"x":"أَعُوذُ بِاللَّهِ الْعَظِيمِ، وَبِوَجْهِهِ الْكَرِيمِ، وَسُلْطَانِهِ الْقَدِيمِ، مِنَ الشَّيْطَانِ الرَّجِيمِ","c":"عند دخول المسجد","k":1,"s":"قال الشيطان: حُفظ مني سائر اليوم. رواه أبو داود، وصححه الألباني."},{"t":"d","n":42,"x":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى مُحَمَّدٍ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","c":"عند دخول المسجد","k":1,"s":"الدعاء رواه مسلم، والسلام على النبي ﷺ قبله رواه أبو داود وابن ماجه، وصححه الألباني."},{"t":"d","n":43,"x":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى مُحَمَّدٍ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ، اللَّهُمَّ اعْصِمْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ","c":"عند الخروج من المسجد","k":1,"s":"«اللهم إني أسألك من فضلك» رواه مسلم، والباقي رواه ابن ماجه، وصححه الألباني."}]},{"id":"s16","kind":"chap","title":"أذكار الأذان","part":"s12","items":[{"t":"d","n":44,"x":"يقول مثل ما يقول المؤذن، إلا في «حي على الصلاة» و«حي على الفلاح» فيقول: لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","c":"","k":1,"s":"متفق عليه، والحوقلة عند مسلم."},{"t":"d","n":45,"x":"وَأَنَا أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللَّهِ رَبًّا، وَبِمُحَمَّدٍ رَسُولًا، وَبِالْإِسْلَامِ دِينًا","c":"بعد تشهد المؤذن","k":1,"s":"غُفر له ذنبه. رواه مسلم."},{"t":"d","n":46,"x":"اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ","c":"بعد الأذان","k":1,"s":"حلّت له شفاعته ﷺ يوم القيامة. رواه البخاري. ويُصلّي على النبي ﷺ قبله (رواه مسلم)."},{"t":"n","x":"والدعاء بين الأذان والإقامة لا يُرد (رواه أبو داود والترمذي، وصححه الألباني)."}]},{"id":"s17","kind":"chap","title":"أذكار الصلاة","part":"s12","items":[{"t":"d","n":47,"x":"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ","c":"دعاء الاستفتاح","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":48,"x":"اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ","c":"دعاء الاستفتاح","k":1,"s":"متفق عليه."},{"t":"d","n":49,"x":"وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا، وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي، وَنُسُكِي، وَمَحْيَايَ، وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ، وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ، اللَّهُمَّ أَنْتَ الْمَلِكُ لَا إِلَهَ إِلَّا أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي، وَاعْتَرَفْتُ بِذَنْبِي، فَاغْفِرْ لِي ذُنُوبِي جَمِيعًا، إِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، وَاهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا لَا يَصْرِفُ عَنِّي سَيِّئَهَا إِلَّا أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالْخَيْرُ كُلُّهُ فِي يَدَيْكَ، وَالشَّرُّ لَيْسَ إِلَيْكَ، أَنَا بِكَ وَإِلَيْكَ، تَبَارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ","c":"دعاء الاستفتاح","k":1,"s":"من حديث علي بن أبي طالب. رواه مسلم."},{"t":"d","n":50,"x":"اللَّهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا","c":"دعاء الاستفتاح","k":1,"s":"قالها رجل في استفتاح الصلاة، فقال ﷺ: «عجبتُ لها، فُتحت لها أبواب السماء». رواه مسلم."},{"t":"d","n":51,"x":"الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ","c":"دعاء الاستفتاح","k":1,"s":"قالها رجل في استفتاح الصلاة، فقال ﷺ: «لقد رأيت اثني عشر ملكًا يبتدرونها أيهم يرفعها». رواه مسلم."},{"t":"d","n":52,"x":"اللَّهُمَّ لَكَ الْحَمْدُ، أَنْتَ قَيِّمُ السَّمَاوَاتِ وَالْأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ، لَكَ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ، أَنْتَ نُورُ السَّمَاوَاتِ وَالْأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ، أَنْتَ الْحَقُّ، وَوَعْدُكَ الْحَقُّ، وَلِقَاؤُكَ حَقٌّ، وَقَوْلُكَ حَقٌّ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، وَالنَّبِيُّونَ حَقٌّ، وَمُحَمَّدٌ ﷺ حَقٌّ، وَالسَّاعَةُ حَقٌّ، اللَّهُمَّ لَكَ أَسْلَمْتُ، وَبِكَ آمَنْتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خَاصَمْتُ، وَإِلَيْكَ حَاكَمْتُ، فَاغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ، أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، لَا إِلَهَ إِلَّا أَنْتَ","c":"استفتاح صلاة الليل","k":1,"s":"كان النبي ﷺ يقوله إذا قام من الليل يتهجد. متفق عليه."},{"t":"d","n":53,"x":"اللَّهُمَّ رَبَّ جَبْرَائِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ، اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ، إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ","c":"استفتاح صلاة الليل","k":1,"s":"رواه مسلم."},{"t":"d","n":54,"x":"سُبْحَانَ رَبِّيَ الْعَظِيمِ","c":"في الركوع، يكررها","k":1,"s":"رواه مسلم."},{"t":"d","n":55,"x":"سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي","c":"في الركوع والسجود","k":1,"s":"كان النبي ﷺ يُكثر أن يقولها. متفق عليه."},{"t":"d","n":56,"x":"سُبُّوحٌ قُدُّوسٌ، رَبُّ الْمَلَائِكَةِ وَالرُّوحِ","c":"في الركوع والسجود","k":1,"s":"رواه مسلم."},{"t":"d","n":57,"x":"سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ، رَبَّنَا وَلَكَ الْحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ","c":"عند الرفع من الركوع","k":1,"s":"رواه البخاري."},{"t":"d","n":58,"x":"رَبَّنَا لَكَ الْحَمْدُ، مِلْءَ السَّمَاوَاتِ وَمِلْءَ الْأَرْضِ، وَمِلْءَ مَا بَيْنَهُمَا، وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ، أَهْلَ الثَّنَاءِ وَالْمَجْدِ، أَحَقُّ مَا قَالَ الْعَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ","c":"بعد الرفع من الركوع","k":1,"s":"رواه مسلم."},{"t":"d","n":59,"x":"سُبْحَانَ رَبِّيَ الْأَعْلَى","c":"في السجود، يكررها","k":1,"s":"رواه مسلم."},{"t":"d","n":60,"x":"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ","c":"في السجود","k":1,"s":"رواه مسلم. وقال ﷺ: «أقرب ما يكون العبد من ربه وهو ساجد، فأكثروا الدعاء» رواه مسلم."},{"t":"d","n":61,"x":"رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي","c":"بين السجدتين","k":1,"s":"رواه أبو داود وابن ماجه، وصححه الألباني."},{"t":"d","n":62,"x":"التَّحِيَّاتُ لِلَّهِ، وَالصَّلَوَاتُ، وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ","c":"التشهد","k":1,"s":"من حديث ابن مسعود. متفق عليه. ثم يصلي على النبي ﷺ بالصلاة الإبراهيمية، وقد سبقت في الباب الأول."},{"t":"d","n":63,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ، وَمِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ","c":"بعد التشهد الأخير، قبل السلام","k":1,"s":"أمر به النبي ﷺ. رواه مسلم."}]},{"id":"s18","kind":"chap","title":"الأذكار بعد السلام من الصلاة","part":"s12","items":[{"t":"d","n":64,"x":"أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، اللَّهُمَّ أَنْتَ السَّلَامُ، وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":65,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ","c":"","k":1,"s":"متفق عليه."},{"t":"d","n":66,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، لَا إِلَهَ إِلَّا اللَّهُ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":67,"x":"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَاللَّهُ أَكْبَرُ","c":"ثلاثًا وثلاثين لكلٍّ منها","k":33,"s":"ثم يقول تمام المئة: «لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير»، غُفرت خطاياه وإن كانت مثل زبد البحر. رواه مسلم."},{"t":"d","n":68,"x":"آيَةُ الْكُرْسِيِّ: {{اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ}} إلى آخر الآية [البقرة: ٢٥٥]","c":"دبر كل صلاة","k":1,"s":"لم يمنعه من دخول الجنة إلا أن يموت. رواه النسائي في الكبرى، وصححه الألباني."},{"t":"d","n":69,"x":"قراءة سورة الإخلاص، والمعوذتين: الفلق والناس","c":"دبر كل صلاة","k":1,"s":"رواه أبو داود والنسائي، وصححه الألباني."},{"t":"d","n":70,"x":"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ","c":"دبر كل صلاة","k":1,"s":"وصية النبي ﷺ لمعاذ بن جبل. رواه أبو داود والنسائي، وصححه الألباني."}]},{"id":"s19","kind":"chap","title":"أذكار الصباح والمساء","part":"s12","items":[{"t":"n","x":"وقت أذكار الصباح من طلوع الفجر إلى ارتفاع الشمس، ووقت أذكار المساء من العصر إلى الغروب، وما بين القوسين يقال في المساء."},{"t":"d","n":71,"x":"آيَةُ الْكُرْسِيِّ: {{اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ}} إلى آخر الآية","c":"مرة واحدة","k":1,"s":"من قالها حين يصبح أُجير من الجن حتى يمسي، ومن قالها حين يمسي أُجير منهم حتى يصبح. رواه ابن حبان والحاكم، وصححه الألباني."},{"t":"d","n":72,"x":"قراءة سورة الإخلاص، والمعوذتين: الفلق والناس","c":"ثلاث مرات","k":3,"s":"«تكفيك من كل شيء». رواه أبو داود والترمذي، وحسّنه الألباني."},{"t":"d","n":73,"x":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ (أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ)، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ (هَذِهِ اللَّيْلَةِ) وَخَيْرَ مَا بَعْدَهُ (بَعْدَهَا)، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ (هَذِهِ اللَّيْلَةِ) وَشَرِّ مَا بَعْدَهُ (بَعْدَهَا)، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ","c":"مرة واحدة","k":1,"s":"رواه مسلم."},{"t":"d","n":74,"x":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ (وفي المساء: اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ)","c":"مرة واحدة","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":75,"x":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","c":"مرة واحدة","k":1,"s":"من قالها موقنًا بها فمات من يومه أو ليلته دخل الجنة. رواه البخاري."},{"t":"d","n":76,"x":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ","c":"ثلاث مرات","k":3,"s":"رواه أبو داود، وحسّن الألباني إسناده."},{"t":"d","n":77,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي","c":"مرة واحدة","k":1,"s":"لم يكن النبي ﷺ يدعهن حين يمسي وحين يصبح. رواه أبو داود وابن ماجه، وصححه الألباني."},{"t":"d","n":78,"x":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ","c":"مرة واحدة، وعند النوم","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":79,"x":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ","c":"ثلاث مرات","k":3,"s":"لم يضره شيء. رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":80,"x":"يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ","c":"مرة واحدة","k":1,"s":"أوصى به النبي ﷺ فاطمة رضي الله عنها. رواه النسائي في الكبرى والحاكم، وحسّنه الألباني."},{"t":"d","n":81,"x":"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا، وَمَا كَانَ مِنَ الْمُشْرِكِينَ","c":"في الصباح","k":1,"s":"رواه أحمد، وصححه الألباني."},{"t":"d","n":82,"x":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","c":"ثلاث مرات في المساء","k":3,"s":"لم تضره حُمةٌ تلك الليلة. رواه مسلم، والعدد عند الترمذي، وصححه الألباني."},{"t":"d","n":83,"x":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","c":"مئة مرة","k":100,"s":"لم يأتِ أحد يوم القيامة بأفضل مما جاء به إلا أحد قال مثل ما قال أو زاد عليه. رواه مسلم."},{"t":"d","n":84,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","c":"مئة مرة في اليوم","k":100,"s":"وكانت له حرزًا من الشيطان يومه ذلك حتى يمسي. متفق عليه."},{"t":"d","n":85,"x":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ","c":"ثلاث مرات في الصباح","k":3,"s":"رواه مسلم."},{"t":"d","n":86,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا","c":"بعد صلاة الصبح","k":1,"s":"رواه ابن ماجه، وصححه الألباني."},{"t":"n","x":"وأما أذكار الصباح والمساء المشهورة التي في أسانيدها كلام، فقد جُعلت في ملحق آخر الكتاب مع بيان درجاتها."}]},{"id":"s20","kind":"chap","title":"أذكار الخروج من البيت ودخوله","part":"s12","items":[{"t":"d","n":87,"x":"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","c":"عند الخروج من البيت","k":1,"s":"يُقال له: هُديت وكُفيت ووُقيت، وتنحّى عنه الشيطان. رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":88,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ","c":"عند الخروج من البيت","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":89,"x":"بِسْمِ اللَّهِ","c":"عند دخول البيت","k":1,"s":"قال ﷺ: «إذا دخل الرجل بيته فذكر الله عند دخوله وعند طعامه، قال الشيطان: لا مبيت لكم ولا عشاء». رواه مسلم."},{"t":"a","x":"{{فَإِذَا دَخَلْتُم بُيُوتًا فَسَلِّمُوا عَلَىٰ أَنفُسِكُمْ تَحِيَّةً مِّنْ عِندِ اللَّهِ مُبَارَكَةً طَيِّبَةً}} [النور: ٦١]"}]},{"id":"s21","kind":"chap","title":"أذكار الطعام والشراب","part":"s12","items":[{"t":"d","n":90,"x":"بِسْمِ اللَّهِ","c":"قبل الطعام","k":1,"s":"فإن نسي في أوله فليقل: «بسم الله أوله وآخره». رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":91,"x":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","c":"بعد الطعام","k":1,"s":"غُفر له ما تقدم من ذنبه. رواه أبو داود والترمذي، وحسّنه الألباني."},{"t":"d","n":92,"x":"الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ، غَيْرَ مَكْفِيٍّ وَلَا مُوَدَّعٍ وَلَا مُسْتَغْنًى عَنْهُ رَبَّنَا","c":"بعد الطعام","k":1,"s":"رواه البخاري."},{"t":"d","n":93,"x":"اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ، وَارْحَمْهُمْ","c":"دعاء الضيف لأهل الطعام","k":1,"s":"رواه مسلم."},{"t":"d","n":94,"x":"ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ","c":"عند الإفطار من الصيام","k":1,"s":"رواه أبو داود، وحسّنه الألباني."}]},{"id":"s22","kind":"chap","title":"أذكار اللباس","part":"s12","items":[{"t":"d","n":95,"x":"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا، وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","c":"عند لبس الثوب","k":1,"s":"غُفر له ما تقدم من ذنبه. رواه أبو داود، وحسّنه الألباني."},{"t":"d","n":96,"x":"اللَّهُمَّ لَكَ الْحَمْدُ، أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ","c":"عند لبس الثوب الجديد","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":97,"x":"بِسْمِ اللَّهِ","c":"عند خلع الثياب","k":1,"s":"«سَترُ ما بين أعين الجن وعورات بني آدم إذا وضع أحدهم ثوبه أن يقول: بسم الله». رواه الطبراني في الأوسط، وصححه الألباني."}]},{"id":"s23","kind":"chap","title":"أذكار النوم","part":"s12","items":[{"t":"d","n":98,"x":"يجمع كفيه، ثم ينفث فيهما ويقرأ: سورة الإخلاص، والفلق، والناس، ثم يمسح بهما ما استطاع من جسده، يبدأ برأسه ووجهه","c":"ثلاث مرات","k":3,"s":"رواه البخاري."},{"t":"d","n":99,"x":"آيَةُ الْكُرْسِيِّ: {{اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ}} إلى آخر الآية","c":"","k":1,"s":"لم يزل عليه من الله حافظ، ولا يقربه شيطان حتى يصبح. رواه البخاري."},{"t":"d","n":100,"x":"{{آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ}} إلى آخر سورة البقرة [البقرة: ٢٨٥-٢٨٦]","c":"","k":1,"s":"«من قرأ بالآيتين من آخر سورة البقرة في ليلة كفتاه». متفق عليه."},{"t":"d","n":101,"x":"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ","c":"","k":1,"s":"متفق عليه."},{"t":"d","n":102,"x":"اللَّهُمَّ إِنَّكَ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْيَاهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":103,"x":"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ","c":"ثلاث مرات","k":3,"s":"كان النبي ﷺ يضع يده اليمنى تحت خده ثم يقولها. رواه أبو داود، وصححه الألباني."},{"t":"d","n":104,"x":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","c":"","k":1,"s":"رواه البخاري."},{"t":"d","n":105,"x":"سُبْحَانَ اللَّهِ (ثلاثًا وثلاثين)، وَالْحَمْدُ لِلَّهِ (ثلاثًا وثلاثين)، وَاللَّهُ أَكْبَرُ (أربعًا وثلاثين)","c":"","k":1,"s":"قال ﷺ لعلي وفاطمة: «فهو خير لكما من خادم». متفق عليه."},{"t":"d","n":106,"x":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا، وَكَفَانَا وَآوَانَا، فَكَمْ مِمَّنْ لَا كَافِيَ لَهُ وَلَا مُؤْوِيَ","c":"","k":1,"s":"رواه مسلم."},{"t":"d","n":107,"x":"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَنَبِيِّكَ الَّذِي أَرْسَلْتَ","c":"","k":1,"s":"يجعلهن آخر ما يقول، فإن مات من ليلته مات على الفطرة. متفق عليه."},{"t":"n","x":"ومن رأى في منامه ما يكره فلينفث عن يساره ثلاثًا، وليستعذ بالله من الشيطان ومن شرها ثلاثًا، وليتحوّل عن جنبه الذي كان عليه، ولا يحدّث بها أحدًا (رواه مسلم)."}]},{"id":"s24","kind":"part","title":"الباب الثالث: أذكار الأحوال والمناسبات","sub":"ما يقوله المسلم في أحواله العارضة وما ينزل به","part":null,"items":[]},{"id":"s25","kind":"chap","title":"أذكار السفر والركوب","part":"s24","items":[{"t":"d","n":108,"x":"بِسْمِ اللَّهِ، الْحَمْدُ لِلَّهِ، {{سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ}}، الْحَمْدُ لِلَّهِ، الْحَمْدُ لِلَّهِ، الْحَمْدُ لِلَّهِ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، سُبْحَانَكَ اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","c":"عند الركوب","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":109,"x":"اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، {{سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ}}، اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا، وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ","c":"عند الخروج للسفر","k":1,"s":"رواه مسلم. وإذا رجع قالهن وزاد: «آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ»."},{"t":"d","n":110,"x":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","c":"عند نزول منزل","k":1,"s":"لم يضره شيء حتى يرتحل من منزله ذلك. رواه مسلم."},{"t":"d","n":111,"x":"أَسْتَوْدِعُ اللَّهَ دِينَكَ، وَأَمَانَتَكَ، وَخَوَاتِيمَ عَمَلِكَ","c":"توديع المسافر","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":112,"x":"أَسْتَوْدِعُكُمُ اللَّهَ الَّذِي لَا تَضِيعُ وَدَائِعُهُ","c":"يقوله المسافر لمن يخلّفه","k":1,"s":"رواه ابن ماجه، وصححه الألباني."},{"t":"n","x":"وكان الصحابة رضي الله عنهم إذا صعدوا كبّروا، وإذا نزلوا سبّحوا (رواه البخاري)."}]},{"id":"s26","kind":"chap","title":"أذكار الهم والكرب","part":"s24","items":[{"t":"d","n":113,"x":"اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلَاءَ حُزْنِي، وَذَهَابَ هَمِّي","c":"","k":1,"s":"إلا أذهب الله همه وحزنه وأبدله مكانه فرجًا. رواه أحمد، وصححه الألباني."},{"t":"d","n":114,"x":"اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ","c":"","k":1,"s":"دعوات المكروب. رواه أبو داود، وحسّنه الألباني."},{"t":"d","n":115,"x":"اللَّهُ، اللَّهُ رَبِّي، لَا أُشْرِكُ بِهِ شَيْئًا","c":"","k":1,"s":"علّمها النبي ﷺ أسماء بنت عُميس تقولها عند الكرب. رواه أبو داود وابن ماجه، وصححه الألباني."},{"t":"d","n":116,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ","c":"","k":1,"s":"رواه البخاري."},{"t":"d","n":117,"x":"اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا","c":"عند تعسّر الأمر","k":1,"s":"رواه ابن حبان، وصححه الألباني."},{"t":"d","n":118,"x":"اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِمْ، وَنَعُوذُ بِكَ مِنْ شُرُورِهِمْ","c":"عند الخوف من قوم","k":1,"s":"رواه أبو داود، وصححه الألباني."},{"t":"d","n":119,"x":"{{حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ}}","c":"","k":1,"s":"قالها إبراهيم عليه السلام حين أُلقي في النار، وقالها محمد ﷺ حين قالوا: إن الناس قد جمعوا لكم. رواه البخاري."},{"t":"n","x":"ومن أذكار الكرب أيضًا: «لا إله إلا الله العظيم الحليم...»، ودعوة ذي النون، وقد سبقا في فصل التهليل."}]},{"id":"s27","kind":"chap","title":"أذكار المرض والرقية","part":"s24","items":[{"t":"d","n":120,"x":"لَا بَأْسَ، طَهُورٌ إِنْ شَاءَ اللَّهُ","c":"عند عيادة المريض","k":1,"s":"رواه البخاري."},{"t":"d","n":121,"x":"أَسْأَلُ اللَّهَ الْعَظِيمَ، رَبَّ الْعَرْشِ الْعَظِيمِ، أَنْ يَشْفِيَكَ","c":"سبع مرات عند المريض","k":7,"s":"عافاه الله ما لم يحضر أجله. رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":122,"x":"اللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا","c":"","k":1,"s":"كان النبي ﷺ يرقي به. متفق عليه."},{"t":"d","n":123,"x":"يضع يده على الذي يألم من جسده ويقول: بِسْمِ اللَّهِ (ثلاثًا)، ثم يقول: أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ","c":"سبع مرات","k":7,"s":"رواه مسلم."},{"t":"d","n":124,"x":"بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ","c":"","k":1,"s":"رقية جبريل للنبي ﷺ. رواه مسلم."},{"t":"d","n":125,"x":"أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ","c":"تعويذ الأولاد","k":1,"s":"كان النبي ﷺ يعوّذ بها الحسن والحسين. رواه البخاري."},{"t":"n","x":"ومن الرقية: قراءة سورة الفاتحة (رواه البخاري)، والنفث بالمعوذات (متفق عليه). ومن رأى ما يعجبه فليبرّك، كأن يقول: «اللهم بارك عليه»، لقوله ﷺ: «هلّا برّكت» (رواه ابن ماجه، وصححه الألباني)، أو يقول: {{مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ}} [الكهف: ٣٩]."},{"t":"d","n":126,"x":"اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَأَلْحِقْنِي بِالرَّفِيقِ الْأَعْلَى","c":"للمريض إذا اشتد عليه المرض","k":1,"s":"من آخر ما قاله النبي ﷺ. متفق عليه. ويُلقَّن المحتضر: «لا إله إلا الله» (رواه مسلم)."}]},{"id":"s28","kind":"chap","title":"صلاة الاستخارة","part":"s24","items":[{"t":"n","x":"يصلي ركعتين من غير الفريضة، ثم يدعو بهذا الدعاء، ويسمّي حاجته."},{"t":"d","n":127,"x":"اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ (ويسمّي حاجته) خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاقْدُرْهُ لِي، وَيَسِّرْهُ لِي، ثُمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي، فَاصْرِفْهُ عَنِّي، وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ، ثُمَّ أَرْضِنِي بِهِ","c":"","k":1,"s":"من حديث جابر بن عبد الله: كان النبي ﷺ يعلّمنا الاستخارة في الأمور كلها كما يعلّمنا السورة من القرآن. رواه البخاري."}]},{"id":"s29","kind":"chap","title":"أذكار المصيبة والجنائز","part":"s24","items":[{"t":"d","n":128,"x":"{{إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ}}، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا","c":"عند المصيبة","k":1,"s":"إلا أخلف الله له خيرًا منها. رواه مسلم."},{"t":"d","n":129,"x":"إِنَّ لِلَّهِ مَا أَخَذَ، وَلَهُ مَا أَعْطَى، وَكُلُّ شَيْءٍ عِنْدَهُ بِأَجَلٍ مُسَمًّى، فَلْتَصْبِرْ وَلْتَحْتَسِبْ","c":"التعزية","k":1,"s":"متفق عليه."},{"t":"d","n":130,"x":"اللَّهُمَّ اغْفِرْ لِـ(فلان)، وَارْفَعْ دَرَجَتَهُ فِي الْمَهْدِيِّينَ، وَاخْلُفْهُ فِي عَقِبِهِ فِي الْغَابِرِينَ، وَاغْفِرْ لَنَا وَلَهُ يَا رَبَّ الْعَالَمِينَ، وَافْسَحْ لَهُ فِي قَبْرِهِ، وَنَوِّرْ لَهُ فِيهِ","c":"عند تغميض الميت","k":1,"s":"قاله النبي ﷺ لأبي سلمة رضي الله عنه. رواه مسلم."},{"t":"d","n":131,"x":"اللَّهُمَّ اغْفِرْ لَهُ، وَارْحَمْهُ، وَعَافِهِ، وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ، وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ، وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ، وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ، وَأَدْخِلْهُ الْجَنَّةَ، وَأَعِذْهُ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ النَّارِ","c":"في صلاة الجنازة","k":1,"s":"رواه مسلم."},{"t":"d","n":132,"x":"اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا، وَشَاهِدِنَا وَغَائِبِنَا، وَصَغِيرِنَا وَكَبِيرِنَا، وَذَكَرِنَا وَأُنْثَانَا، اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا فَأَحْيِهِ عَلَى الْإِسْلَامِ، وَمَنْ تَوَفَّيْتَهُ مِنَّا فَتَوَفَّهُ عَلَى الْإِيمَانِ، اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهُ، وَلَا تُضِلَّنَا بَعْدَهُ","c":"في صلاة الجنازة","k":1,"s":"رواه أبو داود وابن ماجه، وصححه الألباني."},{"t":"d","n":133,"x":"بِسْمِ اللَّهِ، وَعَلَى سُنَّةِ رَسُولِ اللَّهِ","c":"عند إدخال الميت القبر","k":1,"s":"رواه أبو داود، وصححه الألباني. وبعد الدفن قال ﷺ: «استغفروا لأخيكم، وسلوا له التثبيت، فإنه الآن يُسأل» رواه أبو داود، وصححه الألباني."},{"t":"d","n":134,"x":"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ، أَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ","c":"عند زيارة القبور","k":1,"s":"رواه مسلم."}]},{"id":"s30","kind":"chap","title":"أذكار المطر والريح","part":"s24","items":[{"t":"d","n":135,"x":"اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَخَيْرَ مَا فِيهَا، وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا، وَشَرِّ مَا فِيهَا، وَشَرِّ مَا أُرْسِلَتْ بِهِ","c":"عند هبوب الريح","k":1,"s":"رواه مسلم."},{"t":"d","n":136,"x":"سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ، وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ","c":"عند سماع الرعد","k":1,"s":"موقوف على عبد الله بن الزبير رضي الله عنهما. رواه مالك والبخاري في الأدب المفرد، وصحح الألباني إسناده موقوفًا."},{"t":"d","n":137,"x":"اللَّهُمَّ صَيِّبًا نَافِعًا","c":"عند نزول المطر","k":1,"s":"رواه البخاري."},{"t":"d","n":138,"x":"مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ","c":"بعد نزول المطر","k":1,"s":"متفق عليه."},{"t":"d","n":139,"x":"اللَّهُمَّ حَوَالَيْنَا وَلَا عَلَيْنَا، اللَّهُمَّ عَلَى الْآكَامِ وَالظِّرَابِ، وَبُطُونِ الْأَوْدِيَةِ، وَمَنَابِتِ الشَّجَرِ","c":"عند كثرة المطر وخوف الضرر","k":1,"s":"متفق عليه."},{"t":"d","n":140,"x":"اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا","c":"في الاستسقاء","k":1,"s":"متفق عليه."},{"t":"d","n":141,"x":"اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، رَبِّي وَرَبُّكَ اللَّهُ","c":"عند رؤية الهلال","k":1,"s":"رواه الترمذي، وصححه الألباني."}]},{"id":"s31","kind":"chap","title":"أذكار متفرقة","part":"s24","items":[{"t":"d","n":142,"x":"الْحَمْدُ لِلَّهِ","c":"إذا عطس","k":1,"s":"ويقول له أخوه: «يَرْحَمُكَ اللَّهُ»، فيرد: «يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ». رواه البخاري."},{"t":"d","n":143,"x":"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ","c":"عند الغضب","k":1,"s":"متفق عليه."},{"t":"d","n":144,"x":"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ","c":"كفارة المجلس","k":1,"s":"غُفر له ما كان في مجلسه ذلك. رواه الترمذي، وصححه الألباني."},{"t":"d","n":145,"x":"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلَاكَ بِهِ، وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلًا","c":"عند رؤية المبتلى","k":1,"s":"لم يُصبه ذلك البلاء. رواه الترمذي، وحسّنه الألباني."},{"t":"d","n":146,"x":"الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ","c":"إذا رأى ما يحب","k":1,"s":"وإذا رأى ما يكره قال: «الحمد لله على كل حال». رواه ابن ماجه، وحسّنه الألباني."},{"t":"d","n":147,"x":"جَزَاكَ اللَّهُ خَيْرًا","c":"لمن صنع إليه معروفًا","k":1,"s":"فقد أبلغ في الثناء. رواه الترمذي، وصححه الألباني."},{"t":"d","n":148,"x":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا لَا أَعْلَمُ","c":"الخوف من الشرك","k":1,"s":"رواه أحمد والبخاري في الأدب المفرد، وصححه الألباني."},{"t":"d","n":149,"x":"بَارَكَ اللَّهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ","c":"التهنئة بالزواج","k":1,"s":"رواه أبو داود والترمذي، وصححه الألباني."},{"t":"d","n":150,"x":"بِسْمِ اللَّهِ، اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ، وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا","c":"قبل الجماع","k":1,"s":"فإن قُدّر بينهما ولد لم يضره الشيطان أبدًا. متفق عليه."},{"t":"d","n":151,"x":"لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ","c":"التلبية في الحج والعمرة","k":1,"s":"متفق عليه."},{"t":"d","n":152,"x":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","c":"يوم عرفة","k":1,"s":"«خير الدعاء دعاء يوم عرفة، وخير ما قلت أنا والنبيون من قبلي...». رواه الترمذي، وحسّنه الألباني."},{"t":"d","n":153,"x":"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","c":"في ليلة القدر","k":1,"s":"علّمه النبي ﷺ عائشة رضي الله عنها. رواه الترمذي وابن ماجه، وصححه الألباني. وزيادة «كريم» لا أصل لها في كتب الحديث كما نبّه عليه الألباني."},{"t":"n","x":"وإذا سمع صياح الديكة فليسأل الله من فضله، وإذا سمع نهيق الحمار أو نباح الكلب بالليل فليتعوّذ بالله من الشيطان (متفق عليه، وحديث الكلب رواه أبو داود وصححه الألباني)."}]},{"id":"s60","kind":"chap","title":"سنن يوم الجمعة وآدابه","part":"s24","items":[{"t":"p","x":"يوم الجمعة خيرُ أيام الأسبوع، وقد خصّه الله تعالى بسننٍ وآدابٍ ثابتة، هذه أهمّها مع أدلّتها باختصار:"},{"t":"h","x":"«خَيْرُ يَوْمٍ طَلَعَتْ عَلَيْهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَلَا تَقُومُ السَّاعَةُ إِلَّا فِي يَوْمِ الْجُمُعَةِ»","s":"رواه مسلم."},{"t":"b","x":"قراءة سورتَي السجدة والإنسان في صلاة الفجر: كان النبي ﷺ يقرأ في الفجر يوم الجمعة: {{الم ۝ تَنزِيلُ}} في الأولى، و{{هَلْ أَتَىٰ عَلَى الْإِنسَانِ}} في الثانية (متفق عليه)."},{"t":"b","x":"الغُسل، وهو سنّة مؤكدة عند جمهور العلماء: «الْغُسْلُ يَوْمَ الْجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِمٍ، وَأَنْ يَسْتَنَّ، وَأَنْ يَمَسَّ طِيبًا إِنْ وَجَدَ» (متفق عليه). ومن اكتفى بالوضوء أجزأه: «مَنْ تَوَضَّأَ يَوْمَ الْجُمُعَةِ فَبِهَا وَنِعْمَتْ، وَمَنِ اغْتَسَلَ فَالْغُسْلُ أَفْضَلُ» (رواه أبو داود والترمذي والنسائي، وصححه الألباني)."},{"t":"b","x":"السواك، والتطيّب، ولبس أحسن الثياب، لحديث: «مَنِ اغْتَسَلَ يَوْمَ الْجُمُعَةِ، وَاسْتَاكَ، وَمَسَّ مِنْ طِيبٍ إِنْ كَانَ عِنْدَهُ، وَلَبِسَ مِنْ أَحْسَنِ ثِيَابِهِ...» (رواه أبو داود وأحمد، وصححه ابن خزيمة وابن حبان)."},{"t":"b","x":"التبكير إلى المسجد: «مَنِ اغْتَسَلَ يَوْمَ الْجُمُعَةِ غُسْلَ الْجَنَابَةِ، ثُمَّ رَاحَ فِي السَّاعَةِ الْأُولَى فَكَأَنَّمَا قَرَّبَ بَدَنَةً...»، فإذا خرج الإمام حضرت الملائكة يستمعون الذكر (متفق عليه)."},{"t":"b","x":"المشي إليها، والدنوّ من الإمام: «مَنْ غَسَّلَ يَوْمَ الْجُمُعَةِ وَاغْتَسَلَ، ثُمَّ بَكَّرَ وَابْتَكَرَ، وَمَشَى وَلَمْ يَرْكَبْ، وَدَنَا مِنَ الْإِمَامِ فَاسْتَمَعَ وَلَمْ يَلْغُ، كَانَ لَهُ بِكُلِّ خُطْوَةٍ عَمَلُ سَنَةٍ، أَجْرُ صِيَامِهَا وَقِيَامِهَا» (رواه أبو داود والترمذي والنسائي، وصححه الألباني)."},{"t":"b","x":"الإنصات للخطبة، والكلام أثناءها محرّم عند جمهور العلماء: «إِذَا قُلْتَ لِصَاحِبِكَ يَوْمَ الْجُمُعَةِ: أَنْصِتْ، وَالْإِمَامُ يَخْطُبُ، فَقَدْ لَغَوْتَ» (متفق عليه)."},{"t":"b","x":"قراءة سورة الكهف: «مَنْ قَرَأَ سُورَةَ الْكَهْفِ فِي يَوْمِ الْجُمُعَةِ أَضَاءَ لَهُ مِنَ النُّورِ مَا بَيْنَ الْجُمُعَتَيْنِ» (رواه الحاكم والبيهقي، وصححه الألباني)."},{"t":"b","x":"الإكثار من الصلاة على النبي ﷺ: «إِنَّ مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمَ الْجُمُعَةِ... فَأَكْثِرُوا عَلَيَّ مِنَ الصَّلَاةِ فِيهِ» (رواه أبو داود والنسائي، وصححه الألباني)، وصيغها في فصل الصلاة على النبي ﷺ."},{"t":"b","x":"تحرّي ساعة الإجابة: «فِيهِ سَاعَةٌ لَا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ وَهُوَ قَائِمٌ يُصَلِّي، يَسْأَلُ اللَّهَ شَيْئًا إِلَّا أَعْطَاهُ إِيَّاهُ» (متفق عليه). وأرجى ما قيل فيها وقتان: ما بين أن يجلس الإمام إلى أن تُقضى الصلاة (رواه مسلم)، وآخر ساعة بعد العصر (رواه أبو داود والنسائي، وصححه الألباني). ورجّح ابن القيم الثاني، وقال ابن عثيمين: هذان أرجى الوقتين."},{"t":"b","x":"ليس للجمعة سنّة راتبة قبلها عند أكثر العلماء، ويصلّي الداخل ما كُتب له حتى يخرج الإمام. وأما بعدها: «إِذَا صَلَّى أَحَدُكُمُ الْجُمُعَةَ فَلْيُصَلِّ بَعْدَهَا أَرْبَعًا» (رواه مسلم)، وكان النبي ﷺ يصلّي بعدها ركعتين في بيته (متفق عليه)؛ فإن صلّى في المسجد صلّى أربعًا، وإن صلّى في بيته صلّى ركعتين، وهو اختيار ابن تيمية وابن القيم."},{"t":"n","x":"المصدر: الموسوعة الفقهية في موقع الدرر السنية، باب صلاة الجمعة، فصل «آداب يوم الجمعة وصلاتها»، مع الرجوع إلى أحكام الألباني على الأحاديث."}]},{"id":"s32","kind":"part","title":"الباب الرابع: الأدعية من الكتاب والسنة","sub":"أدعية القرآن الكريم، ثم ما صحّ من دعاء النبي ﷺ","part":null,"items":[]},{"id":"s33","kind":"chap","title":"من آداب الدعاء","part":"s32","items":[{"t":"b","x":"الإخلاص لله تعالى، وحضور القلب، واليقين بالإجابة، لقوله ﷺ: «ادعوا الله وأنتم موقنون بالإجابة» (رواه الترمذي، وحسّنه الألباني)."},{"t":"b","x":"البدء بحمد الله والثناء عليه، ثم الصلاة على النبي ﷺ، ثم الدعاء بما شاء (رواه أبو داود والترمذي، وصححه الألباني)."},{"t":"b","x":"العزم في المسألة وعدم التعليق بالمشيئة، لقوله ﷺ: «لا يقل أحدكم: اللهم اغفر لي إن شئت، ليعزم المسألة» (متفق عليه)."},{"t":"b","x":"ترك الاستعجال، لقوله ﷺ: «يُستجاب لأحدكم ما لم يعجل، يقول: دعوتُ فلم يُستجب لي» (متفق عليه)."},{"t":"b","x":"اجتناب الإثم وقطيعة الرحم في الدعاء، وطيب المطعم والمشرب، فإن الله طيب لا يقبل إلا طيبًا (رواه مسلم)."},{"t":"b","x":"تحرّي أوقات الإجابة: الثلث الأخير من الليل (متفق عليه)، وبين الأذان والإقامة (رواه أبو داود والترمذي، وصححه الألباني)، وفي السجود (رواه مسلم)، وآخر ساعة من يوم الجمعة (رواه أبو داود، وصححه الألباني)، ودعوة المظلوم والمسافر والوالد لولده (رواه الترمذي، وحسّنه الألباني)."},{"t":"b","x":"الإكثار من الجوامع من الدعاء، فقد كان النبي ﷺ يستحب الجوامع من الدعاء ويدع ما سوى ذلك (رواه أبو داود، وصححه الألباني)."}]},{"id":"s34","kind":"chap","title":"أدعية من القرآن الكريم","part":"s32","items":[{"t":"d","n":154,"x":"{{رَبَّنَا تَقَبَّلْ مِنَّا ۖ إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ ۝ رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا ۖ إِنَّكَ أَنتَ التَّوَّابُ الرَّحِيمُ}}","c":"","k":1,"s":"دعاء إبراهيم وإسماعيل عليهما السلام [البقرة: ١٢٧-١٢٨]."},{"t":"d","n":155,"x":"{{رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ}}","c":"","k":1,"s":"[البقرة: ٢٠١]. وكان أكثر دعاء النبي ﷺ (متفق عليه)."},{"t":"d","n":156,"x":"{{رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ}}","c":"","k":1,"s":"دعاء المؤمنين مع طالوت [البقرة: ٢٥٠]."},{"t":"d","n":157,"x":"{{سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ}}","c":"","k":1,"s":"من دعاء المؤمنين [البقرة: ٢٨٥]."},{"t":"d","n":158,"x":"{{رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ}}","c":"","k":1,"s":"[البقرة: ٢٨٦]. قال الله تعالى عقب كل دعوة منها: «قد فعلتُ» (رواه مسلم)."},{"t":"d","n":159,"x":"{{رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ}}","c":"","k":1,"s":"دعاء الراسخين في العلم [آل عمران: ٨]."},{"t":"d","n":160,"x":"{{رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ}}","c":"","k":1,"s":"[آل عمران: ١٦]."},{"t":"d","n":161,"x":"{{رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ الدُّعَاءِ}}","c":"","k":1,"s":"دعاء زكريا عليه السلام [آل عمران: ٣٨]."},{"t":"d","n":162,"x":"{{رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ}}","c":"","k":1,"s":"دعاء الحواريين [آل عمران: ٥٣]."},{"t":"d","n":163,"x":"{{رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ}}","c":"","k":1,"s":"دعاء الربّيين مع الأنبياء [آل عمران: ١٤٧]."},{"t":"d","n":164,"x":"{{رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ ۝ رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ ۖ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ ۝ رَبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا ۚ رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ ۝ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا
